name: unseeded-campaign
on:
  pull_request:
  push:
    branches: [main, 'codex/playable-02*', 'codex/playable-03*']
permissions:
  contents: read
concurrency:
  group: campaign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser and evidence directory
        shell: bash
        run: |
          set -euo pipefail
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "CAMPAIGN_OUT=$RUNNER_TEMP/campaign" >> "$GITHUB_ENV"
      - name: Pure navigation contracts
        run: node test/campaign-player.js
      - name: New Game to Act 2 through player input
        run: node test/campaign-playthrough.js
      - name: Retain actual route and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
          retention-days: 7
          if-no-files-found: error
