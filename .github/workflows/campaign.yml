name: unseeded-campaign
on:
  pull_request:
  push:
    branches: [main, 'codex/playable-04*', 'codex/playable-06*']
permissions:
  contents: read
concurrency:
  group: campaign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser identity
        shell: bash
        run: |
          set -euo pipefail
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
          node --version
          git rev-parse HEAD
      - name: Core and harness contracts before the browser
        run: |
          node test/smoke.js
          node test/walkthrough.js
          node test/narrative-lint.js
          node test/story-truth-lint.js
          node test/turn-in-place.js
          node test/classic-evidence-bridge.js
          node test/finale-completion-persistence.js
          node test/campaign-player.js
          node test/campaign-report-safety.js
      - name: First fresh-profile complete journey
        run: CAMPAIGN_OUT="$RUNNER_TEMP/campaign/first" node test/campaign-playthrough.js
      - name: Second consecutive fresh-profile complete journey
        run: CAMPAIGN_OUT="$RUNNER_TEMP/campaign/second" node test/campaign-playthrough.js
      - name: Retain actual route and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/campaign
          retention-days: 7
          if-no-files-found: error
