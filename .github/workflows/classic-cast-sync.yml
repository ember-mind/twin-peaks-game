name: classic-cast-sync
on:
  pull_request:
  push:
    branches: [main, 'codex/playable-11*']
permissions:
  contents: read
jobs:
  cast-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Actual classic-to-narrative production poll and saved cast parity
        run: |
          node test/classic-cast-sync.js
          node test/classic-evidence-bridge.js
          node test/cast-presence-sync.js
          node test/cast-continuity-validate.js
          node test/act-2-flow.js
          node test/act-3-flow.js
          node test/act-4-flow.js
          node test/act-5-flow.js
          node test/smoke.js
          node test/walkthrough.js
