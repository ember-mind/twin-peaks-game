# Temporary pinned source repair; removed in the validated production commit.
name: materialize-classic-cast
on:
  push:
    branches: ['codex/playable-11-classic-cast-sync']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ember-mind/twin-peaks-game' && github.ref == 'refs/heads/codex/playable-11-classic-cast-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pin and reproduce original production callback failure
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          assert hashlib.sha256(Path('js/narrative-production.js').read_bytes()).hexdigest()=='491e6ab88daacab1964ec013bfbc07eb40e3526e3bf3c81f9a6fbb6b33f497e3'
          PY
          if node test/classic-cast-sync.js > "$RUNNER_TEMP/cast-before.log" 2>&1; then echo 'Original defect not reproduced'; exit 1; fi
          grep -F 'Classic progress must materialize James' "$RUNNER_TEMP/cast-before.log"
      - name: Reconcile the existing cast seam only when imported progress changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/narrative-production.js');s=p.read_text()
          a='  function syncClassicToNarrative(NR, state, classicFlags) {';assert s.count(a)==1;s=s.replace(a,a+'\n    var changed = false;')
          a='      if (classicFlags[name]) ensureFlag(NR, state, name);';assert s.count(a)==1;s=s.replace(a,"      if (classicFlags[name] && !state.flags[name]) {\n        ensureFlag(NR, state, name);\n        changed = true;\n      }")
          a="    if (classicFlags.done_leland_dove) ensureEvidence(NR, state, 'T_LELAND_TAXI');";assert s.count(a)==1;s=s.replace(a,"    if (classicFlags.done_leland_dove && !state.evidence.T_LELAND_TAXI) {\n      ensureEvidence(NR, state, 'T_LELAND_TAXI');\n      changed = true;\n    }\n    return changed;")
          a='''        syncClassicToNarrative(NR, state, E.state.flags);
                  syncClassicEvidence(NR, state, E.state.clues);
                  if (A.syncCarryoverEvidence) A.syncCarryoverEvidence();''';assert s.count(a)==1
          b='''        var classicChanged = syncClassicToNarrative(NR, state, E.state.flags);
                  var classicEvidence = syncClassicEvidence(NR, state, E.state.clues);
                  var carryoverEvidence = A.syncCarryoverEvidence ? A.syncCarryoverEvidence() : [];
                  // Classic acquisitions bypass NR.commit* hooks. Reconcile the same
                  // authored cast before persisting the imported state, not only after
                  // the next narrative interaction or a page reload.
                  if (classicChanged || classicEvidence.length || carryoverEvidence.length) {
                    if (A.syncNarrativeEntities) A.syncNarrativeEntities('classic-progress');
                  }'''
          s=s.replace(a,b);p.write_text(s)
          PY
          node test/classic-cast-sync.js
          node test/classic-evidence-bridge.js
      - name: All maintained Node commands without altered assertions
        run: |
          node - <<'JS'
          const fs=require('node:fs'),{spawnSync}=require('node:child_process');
          const tests=[...fs.readFileSync('.github/workflows/test.yml','utf8').matchAll(/^\s+run: node (test\/[A-Za-z0-9_./-]+\.js)\s*$/gm)].map(m=>m[1]);
          if(tests.length!==100)throw new Error('Maintained manifest changed');
          let failed=0;for(const file of tests){const r=spawnSync(process.execPath,[file],{encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
            console.log((r.status===0?'PASS ':'FAIL ')+file);if(r.status!==0){failed++;console.log(r.stdout||'',r.stderr||'',r.error||'');}}
          if(failed)process.exitCode=1;
          JS
      - name: Commit only validated bridge and remove this transport
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/codex/playable-11-classic-cast-sync | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/materialize-classic-cast.yml
          git add -- js/narrative-production.js
          git diff --cached --check
          git commit -m 'fix(cast): reconcile imported classic progress before saving it'
          git push origin HEAD:refs/heads/codex/playable-11-classic-cast-sync
