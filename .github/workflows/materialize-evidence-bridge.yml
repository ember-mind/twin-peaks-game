# One-use pinned patch, removed before final PR review.
name: materialize-evidence-bridge
on:
  push:
    branches: ['codex/playable-06-evidence-bridge']
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    if: github.repository == 'ember-mind/twin-peaks-game' && github.ref == 'refs/heads/codex/playable-06-evidence-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Demonstrate missing earned evidence before applying the repair
        shell: bash
        run: |
          set +e
          node test/classic-evidence-bridge.js > /tmp/evidence-before.log 2>&1
          status=$?
          set -e
          cat /tmp/evidence-before.log
          test "$status" -ne 0
          grep -F 'completed Truman dialogue imports its earned diary' /tmp/evidence-before.log
      - name: Apply exact pinned classic-to-narrative inventory bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('js/narrative-production.js'); data=p.read_bytes()
          assert hashlib.sha256(data).hexdigest() == '24357075fcc8f601f34747db52d7ace82bb3f81ecfd940b45a3957832036241b', 'Unexpected production revision'
          s=data.decode('utf-8')
          needle='  function syncClassicToNarrative(NR, state, classicFlags) {'
          replacement='''  // Early classic clues exist only after their dialogue pages finish.
            // Import their authored notebook identities, never infer them from act
            // flags or seeds. Observations do not formulate any proposition.
            function syncClassicEvidence(NR, state, classicClues) {
              if (classicClues === undefined) return;
              if (!Array.isArray(classicClues)) throw new Error('classic_clues_must_be_array');
              var bindings = [['diario', 'E1_DIARIO'], ['lettera_r', 'E3_LETTERA_R']];
              var effects = [];
              bindings.forEach(function (entry) {
                if (classicClues.indexOf(entry[0]) >= 0 && !state.evidence[entry[1]]) effects.push({ evidence: entry[1] });
              });
              if (effects.length) { NR.applyEffects(state, effects); state.revision++; }
            }

            function syncClassicToNarrative(NR, state, classicFlags, classicClues) {
              syncClassicEvidence(NR, state, classicClues);'''
          assert s.count(needle)==1;s=s.replace(needle,replacement)
          changes=[
            ('    state = loaded.state;\n    if (classic && classic.flags) syncClassicToNarrative(NR, state, classic.flags);',
             '    state = loaded.state;\n    var loadedRevision = state.revision;\n    if (classic && classic.flags) syncClassicToNarrative(NR, state, classic.flags, classic.clues);'),
            ('    lastSavedRevision = state.revision;\n    lastSavedClassicFingerprint = classic && NS',
             '    lastSavedRevision = loadedRevision;\n    lastSavedClassicFingerprint = classic && NS'),
            ('syncClassicToNarrative(NR, state, E.state.flags);', 'syncClassicToNarrative(NR, state, E.state.flags, E.state.clues);')
          ]
          for old,new in changes:
            assert s.count(old)==1, 'Patch target must be unique';s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate earned acquisition and existing narrative/save contracts
        run: |
          node test/classic-evidence-bridge.js
          node test/letter-chain-provenance.js
          node test/narrative-repair-contract.js
          node test/act-2-flow.js
          node test/act-3-flow.js
          node test/act-4-flow.js
          node test/act-5-flow.js
          node test/narrative-lint.js
          node test/story-truth-lint.js
          node test/smoke.js
          node test/walkthrough.js
      - name: Commit only the validated bridge on this feature branch
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/codex/playable-06-evidence-bridge | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/narrative-production.js
          git diff --cached --check
          git commit -m 'fix(narrative): carry earned early clues into the later notebook'
          git push origin HEAD:refs/heads/codex/playable-06-evidence-bridge
