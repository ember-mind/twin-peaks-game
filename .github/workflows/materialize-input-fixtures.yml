# One-use fixture-only patch; removed before final review.
name: materialize-input-fixtures
on:
  push:
    branches: ['codex/playable-05-turn-input']
permissions:
  contents: write
jobs:
  update-walking-fixtures:
    if: github.repository == 'ember-mind/twin-peaks-game' && github.ref == 'refs/heads/codex/playable-05-turn-input'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update only the four pinned native walking input helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          pins={
            'hospital-native':'925527f9592aa23160917ae5a19c7987ddc5cecfd66c6a6e80bac31aacd9bad4',
            'room-315-native':'d702eac1503e3409e1e1dc684995c2340846a0be979b62d11546c93e0990ac72',
            'sheriffs-station-native':'8e78b5daa1e614d3196cc370b4c42552233a407231f6c06a3883ddaa6aadb9f5',
            'traincar-native':'f589cbe21a5ecb39064022202ac4192dc024dc473f9fede5b3d9b6e887c0b94b'
          }
          old='''  handlers.keydown({ code, preventDefault: noop, repeat: false });
            handlers.keyup({ code });
            let guard = 40;
            while (guard-- && (Engine.state.player.moving || (Engine.state.player.tx === before[0] && Engine.state.player.ty === before[1]))) frame();
            while (Engine.state.player.moving && guard-- > -40) frame();
            return before[0] !== Engine.state.player.tx || before[1] !== Engine.state.player.ty;'''
          new='''  handlers.keydown({ code, preventDefault: noop, repeat: false });
            let guard = 40;
            // Walking holds the key through a turn; a released short tap only faces.
            try {
              while (guard-- && !Engine.state.player.moving &&
                Engine.state.player.tx === before[0] && Engine.state.player.ty === before[1]) frame();
            } finally { handlers.keyup({ code }); }
            while (Engine.state.player.moving && guard-- > -40) frame();
            const distance = Math.abs(before[0] - Engine.state.player.tx) + Math.abs(before[1] - Engine.state.player.ty);
            assert(distance <= 1, 'one held step must not overshoot');
            return distance === 1;'''
          for name,pin in pins.items():
            p=Path('test')/(name+'.js');data=p.read_bytes()
            assert hashlib.sha256(data).hexdigest()==pin,'Unexpected fixture: '+name
            s=data.decode('utf-8');assert s.count(old)==1,'Exact input helper missing: '+name
            p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: All maintained Node gates, without hiding later failures
        shell: bash
        run: |
          node - <<'JS'
          const fs=require('node:fs'),{spawnSync}=require('node:child_process');
          const source=fs.readFileSync('.github/workflows/test.yml','utf8');
          const tests=[...source.matchAll(/^\s+run: node (test\/[A-Za-z0-9_./-]+\.js)\s*$/gm)].map(m=>m[1]);
          if(tests.length!==100)throw new Error('Expected the current 100-command manifest');
          let failed=0;
          for(const file of tests){const r=spawnSync(process.execPath,[file],{encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
            console.log((r.status===0?'PASS ':'FAIL ')+file);
            if(r.status!==0){failed++;console.log(r.stdout||'',r.stderr||'',r.error||'');}}
          if(failed)process.exitCode=1;
          JS
          node test/turn-in-place.js
      - name: Commit only the validated fixture changes
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/codex/playable-05-turn-input | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- test/hospital-native.js test/room-315-native.js test/sheriffs-station-native.js test/traincar-native.js
          git diff --cached --check
          git commit -m 'test(input): hold physical walking through turns without weakening native scene assertions'
          git push origin HEAD:refs/heads/codex/playable-05-turn-input
