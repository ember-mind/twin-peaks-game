# One-use pinned patch transport. The validated commit deletes this workflow.
name: materialize-notebook-back
on:
  push:
    branches: ['codex/playable-12-notebook-back']
permissions:
  contents: write
jobs:
  validate-and-commit:
    if: github.repository == 'ember-mind/twin-peaks-game' && github.ref == 'refs/heads/codex/playable-12-notebook-back'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce and apply only the exact repair
        shell: bash
        run: |
          set -euo pipefail
          if node test/touch-notebook-navigation.js > /tmp/notebook-before.log 2>&1; then exit 1; fi
          grep 'not ok - notebook_has_back_control' /tmp/notebook-before.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('js/touch.js');raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='7bad80f85bdd81949420566aa083a24de62a8e709a2b384bc9d61b85016631bd'
          s=raw.decode()
          old='  function narrativeChoiceActive() {'
          new='''  // The notebook has its own Escape/back contract. Its semantic DOM is
            // painted by RetroUI, so a hidden DOM-only Close row is not a touch exit.
            function notebookActive() {
              if (!document.querySelectorAll) return false;
              var roots = document.querySelectorAll('#narrative .nw-root');
              for (var i = roots.length - 1; i >= 0; i--) {
                if (roots[i].style.display === 'none') continue;
                return (' ' + (roots[i].className || '') + ' ').indexOf(' nb-root ') >= 0;
              }
              return false;
            }

            function narrativeChoiceActive() {'''
          assert s.count(old)==1;s=s.replace(old,new)
          old="    if (recoveryChoiceActive()) return 'narrative-choice';"
          assert s.count(old)==1;s=s.replace(old,old+"\n    if (notebookActive()) return 'narrative-notebook';")
          old="    } else if (mode === 'narrative-choice') {"
          assert s.count(old)==1;s=s.replace(old,"    } else if (mode === 'narrative-choice' || mode === 'narrative-notebook') {")
          old='''      showControl(uiA, true, 0.85);
                showControl(uiB, false, 0);
              } else if (mode === 'narrative' || mode === 'dialogue' || mode === 'advance') {'''
          new='''      showControl(uiA, true, 0.85);
                if (mode === 'narrative-notebook') {
                  // B emits the notebook's existing Escape action, never KeyT (which
                  // only opens it from play). Reuse the separated play-button geometry.
                  if (choiceLayout.gutter) {
                    placeGutterButton(uiA, 64, choiceLayout.gutterRight, Math.round(viewportSize().height / 2 - 76));
                    placeGutterButton(uiB, 64, choiceLayout.gutterRight + GUTTER_DIAGONAL, Math.round(viewportSize().height / 2 + 18));
                  } else if (!choiceLayout.landscape) {
                    placePortraitButton(uiA, choiceLayout.a, choiceLayout.aRight, choiceLayout.controlTop + 8);
                    placePortraitButton(uiB, choiceLayout.b, choiceLayout.bRight, choiceLayout.controlTop + 74);
                  } else {
                    restorePlayButton(uiA, choiceLayout.a, choiceLayout.aRight, choiceLayout.aBottom);
                    restorePlayButton(uiB, choiceLayout.b, choiceLayout.bRight, choiceLayout.bBottom);
                  }
                  buttonFace(uiB, 'B', 'INDIETRO');
                  uiB.setAttribute('aria-label', 'Indietro nel taccuino');
                  showControl(uiB, true, 0.85);
                } else showControl(uiB, false, 0);
              } else if (mode === 'narrative' || mode === 'dialogue' || mode === 'advance') {'''
          assert s.count(old)==1;s=s.replace(old,new);p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='b86a8b29de2d905a13912ad4f1ac3216ed6d2757c6509da957801a3bcc4835eb'
          p=Path('index.html');s=p.read_text();old='js/touch.js?v=r112gutter'
          assert s.count(old)==1;p.write_text(s.replace(old,'js/touch.js?v=r112gutter-notebook-back'))
          PY
          node test/touch-notebook-navigation.js
          node - <<'JS'
          const fs=require('node:fs'),{spawnSync}=require('node:child_process');
          const files=[...fs.readFileSync('.github/workflows/test.yml','utf8').matchAll(/^\s+run: node (test\/[A-Za-z0-9_./-]+\.js)\s*$/gm)].map(m=>m[1]);
          if(files.length!==100)throw new Error('Expected maintained 100-command baseline');
          let failures=0;
          for(const file of files){const r=spawnSync(process.execPath,[file],{encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});console.log((r.status===0?'PASS ':'FAIL ')+file);if(r.status!==0){failures++;console.log(r.stdout||'',r.stderr||'',r.error||'');}}
          if(failures)process.exitCode=1;
          JS
      - name: Commit validated production and permanent read-only checks
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          workflow={'name':'notebook-touch','on':{'pull_request':None,'push':{'branches':['main','codex/playable-12*']}},'permissions':{'contents':'read'},'jobs':{'notebook-back':{'runs-on':'ubuntu-latest','timeout-minutes':10,'steps':[{'uses':'actions/checkout@v4','with':{'persist-credentials':False}},{'uses':'actions/setup-node@v4','with':{'node-version':'24'}},{'name':'Notebook exit, nested ownership and existing touch behavior','run':'node test/touch-notebook-navigation.js\nnode test/touch-runtime.js\nnode test/mobile-production.js\nnode test/turn-in-place.js\nnode test/smoke.js\nnode test/walkthrough.js'}]}}}
          Path('.github/workflows/notebook-touch.yml').write_text(json.dumps(workflow,indent=2)+'\n')
          Path('reports/playable-notebook-back.md').write_text('''# Touch notebook exit repair

          Actual touch run 35119931033 passed opening, page advance, turning and movement in both layouts, then could not exit the notebook. Its Close row is hidden semantic DOM and outside the keyboard focus list; the controller hid B as for ordinary narrative choices.

          The topmost visible notebook now exposes B/Back through the existing Escape action, preserving A/D-pad and separated play-button geometry. Hidden notebooks and nested comparisons retain their own input ownership. Gameplay B still opens with KeyT. No plot, save schema or focus-list changes. The touch cache URL is incremented while retaining the existing layout revision prefix.

          Actual controller fixture: original code fails; correction passes 20/20 (all 13 existing checks plus seven notebook checks). The maintained 100-command Node suite is required before this commit. Production touch acceptance belongs to #13 and must include this dependency. Physical devices and human playtests NOT_RUN.

          Temporary patch transport removes itself. Permanent CI is read-only. Main, deployment and local Vault untouched.
          ''')
          Path('.github/workflows/materialize-notebook-back.yml').unlink()
          PY
          test "$(git ls-remote origin refs/heads/codex/playable-12-notebook-back | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/touch.js index.html .github/workflows/notebook-touch.yml .github/workflows/materialize-notebook-back.yml reports/playable-notebook-back.md
          git diff --cached --check
          git commit -m 'fix(touch): expose notebook Back without stealing nested narrative input'
          git push origin HEAD:refs/heads/codex/playable-12-notebook-back
