# Temporary pinned repair transport; removed in the validated source commit.
name: materialize-terminal-checkpoint
on:
  push:
    branches: ['codex/playable-08-final-checkpoint']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'ember-mind/twin-peaks-game' && github.ref == 'refs/heads/codex/playable-08-final-checkpoint'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact sources and reproduce the original failure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'js/narrative-finale.js':'06130dba05866453a82ed11aaf80eef45bd0761ee799b499269e1db3a3303814','js/narrative-save.js':'bd04d1055955f9fd67fafee6785c44e3460cbe37d2bc1e9b4c8f70ec8975e530'}
          for name,digest in expected.items(): assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          PY
          if node test/finale-completion-persistence.js > "$RUNNER_TEMP/terminal-before.log" 2>&1; then echo 'Original defect was not reproduced'; exit 1; fi
          grep -F 'completion must reach the real persistence write' "$RUNNER_TEMP/terminal-before.log"
      - name: Apply the scoped completion checkpoint boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('js/narrative-finale.js');s=p.read_text();needle='  var ui = null;'
          assert s.count(needle)==1;s=s.replace(needle,needle+'\n  var completingCheckpoint = false;')
          needle='    notifyState(outcome);\n    if (run.opts.onComplete)';assert s.count(needle)==1
          s=s.replace(needle,"    // The terminal state is no longer pending, but its final checkpoint must\n    // commit before onComplete clears the saves and opens the ending screen.\n    // Authority exists only during this callback; failure still rolls back.\n    completingCheckpoint = true;\n    try { notifyState(outcome); }\n    finally { completingCheckpoint = false; }\n    if (run.opts.onComplete)")
          needle="  NF.isPending = function () { return !!(run && run.state.stage !== 'complete'); };";assert s.count(needle)==1
          s=s.replace(needle,needle+"\n  NF.isCompletingCheckpoint = function () {\n    return !!(completingCheckpoint && run && run.state.stage === 'complete' && !run.state.active);\n  };")
          p.write_text(s)
          p=Path('js/narrative-save.js');s=p.read_text();needle="    if (!NF || !NF.isPending || !NF.isPending()) return { ok: false, error: 'finale_not_pending' };";assert s.count(needle)==1
          s=s.replace(needle,"    // The completed state needs one last atomic write before onComplete.\n    // The finale grants this authority only inside that synchronous checkpoint;\n    // unrelated writes after completion remain forbidden. No force option.\n    if (!NF || !NF.isPending || (!NF.isPending() &&\n        !(NF.isCompletingCheckpoint && NF.isCompletingCheckpoint()))) {\n      return { ok: false, error: 'finale_not_pending' };\n    }")
          p.write_text(s)
          PY
          node test/finale-completion-persistence.js
      - name: Full maintained Node sweep, no weakened assertions
        run: |
          node - <<'JS'
          const fs=require('node:fs'),{spawnSync}=require('node:child_process');
          const src=fs.readFileSync('.github/workflows/test.yml','utf8');
          const tests=[...src.matchAll(/^\s+run: node (test\/[A-Za-z0-9_./-]+\.js)\s*$/gm)].map(m=>m[1]);
          if(tests.length!==100)throw new Error('Maintained manifest changed');
          let failed=0;for(const file of tests){const r=spawnSync(process.execPath,[file],{encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
            console.log((r.status===0?'PASS ':'FAIL ')+file);if(r.status!==0){failed++;console.log(r.stdout||'',r.stderr||'',r.error||'');}}
          if(failed)process.exitCode=1;
          JS
      - name: Commit only validated source and remove this transport
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/codex/playable-08-final-checkpoint | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/materialize-terminal-checkpoint.yml
          git add -- js/narrative-finale.js js/narrative-save.js
          git diff --cached --check
          git commit -m 'fix(finale): commit the terminal checkpoint before relinquishing save authority'
          git push origin HEAD:refs/heads/codex/playable-08-final-checkpoint
