# One-use mechanical patch materializer. Removed before final PR review.
# Writes ONLY js/engine.js on the explicitly named feature branch; never main.
name: materialize-turn-fix
on:
  push:
    branches: ['codex/playable-05-turn-input']
permissions:
  contents: write
jobs:
  apply-reviewed-patch:
    if: github.repository == 'ember-mind/twin-peaks-game' && github.ref == 'refs/heads/codex/playable-05-turn-input'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify original bytes and apply the exact input change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('js/engine.js')
          original = p.read_bytes()
          assert hashlib.sha256(original).hexdigest() == '91a1996d0290019347a0cca3d8ed9f416afb70a1bf3ae4bfd553432a533cecb0', 'Unexpected engine revision: refuse to overwrite it'
          old = '        p.dir = d;\n        p.turnUntil = tGlobal + 60;'
          new = '        p.dir = d;\n        // A short changed-direction tap is consumed by this turn. A key held\n        // through the delay still walks; a released tap must not force a step\n        // onto a walkable interaction target (e.g. the Roadhouse phone).\n        if (queuedDirection === d) queuedDirection = null;\n        p.turnUntil = tGlobal + 60;'
          source = original.decode('utf-8')
          assert source.count(old) == 1, 'Patch must have exactly one target'
          p.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Verify physical input and existing core behavior
        run: |
          node test/turn-in-place.js
          node test/movement-feel.js
          node test/smoke.js
          node test/walkthrough.js
      - name: Commit only the reviewed engine patch to this feature branch
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/codex/playable-05-turn-input | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/engine.js
          git diff --cached --check
          git commit -m 'fix(input): consume a short directional tap when turning in place'
          git push origin HEAD:refs/heads/codex/playable-05-turn-input
