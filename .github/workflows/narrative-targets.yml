name: narrative-targets
on:
  pull_request:
  push:
    branches: [main, 'codex/world-01*']
permissions:
  contents: read
jobs:
  identity-and-editor-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generated data matches canonical sources
        run: |
          node test/gen-world-data.js
          git diff --exit-code -- js/scene-objects.gen.js js/world-connections.gen.js
      - name: Explicit identity, parity and failure contracts
        run: node test/narrative-targets.js
      - name: Real editor move, reverse move and referenced delete rollback
        run: node test/narrative-targets-apply.js
      - name: Existing scene and narrative regressions
        run: |
          node test/scene-objects-equality.js
          node test/traincar-native.js
          node test/act-3-flow.js
          node test/act-4-flow.js
          node test/act-5-flow.js
          node test/narrative-lint.js
          node test/story-truth-lint.js
          node test/smoke.js
          node test/walkthrough.js
