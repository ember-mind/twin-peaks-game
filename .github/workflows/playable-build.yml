name: playable-build

on:
  pull_request:
  push:
    branches: [main, 'codex/playable-*']

permissions:
  contents: read

concurrency:
  group: playable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Ephemeral hosted runner only. Local usage keeps Chrome sandbox enabled.
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Locate the hosted browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          echo "PLAYABLE_SELFTEST_OUT=$RUNNER_TEMP/playable-selftest" >> "$GITHUB_ENV"
          "$CHROME" --version
          node --version
          git rev-parse HEAD
      - name: Node browser-boundary contracts
        run: node test/playable-browser.js
      - name: Trusted input, isolated profiles, reload and diagnostic self-test
        run: node test/browser/playable-browser-selftest.js
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playable-selftest
          retention-days: 7
          if-no-files-found: warn
      - name: Package committed inputs for offline reproduction
        if: always()
        shell: bash
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/playable-source-sha.txt"
          git archive --format=tar.gz HEAD -- index.html js world narrative assets/sprites assets/portraits test docs reports .github '*.md' > "$RUNNER_TEMP/playable-source.tar.gz"
      - name: Preserve reproducible source snapshot (no credentials or Git directory)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/playable-source-sha.txt
            ${{ runner.temp }}/playable-source.tar.gz
          retention-days: 7
          if-no-files-found: error
