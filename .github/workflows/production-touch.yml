name: production-touch
on:
  pull_request:
  push:
    branches: [main, 'codex/playable-10*']
permissions:
  contents: read
jobs:
  touch-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser identity
        run: |
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
          git rev-parse HEAD
      - name: Geometry and existing physical input contracts
        run: |
          node test/touch-preflight.js
          node test/playable-browser.js
          node test/campaign-player.js
          node test/campaign-report-safety.js
          node test/mobile-production.js
          node test/touch-runtime.js
          node test/turn-in-place.js
      - name: Real touch-only opening and notebook in portrait and landscape
        run: TOUCH_PREFLIGHT_OUT="$RUNNER_TEMP/production-touch" node test/browser/production-touch-preflight.js
      - name: Preserve actual touch results and failure captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-touch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-touch
          retention-days: 7
          if-no-files-found: error
