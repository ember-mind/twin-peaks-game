# Temporary exact-scope review repair; remove after the code commit.
name: review-target-packaging
on:
  push:
    branches: ['codex/world-01-narrative-targets']
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'ember-mind/twin-peaks-game' && github.ref == 'refs/heads/codex/world-01-narrative-targets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Relocate generation-only compiler and repair fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old=Path('js/editor/core/narrative-targets.js');new=Path('js/editor/apply/narrative-targets.js')
          assert old.is_file() and not new.exists()
          new.parent.mkdir(parents=True,exist_ok=True);old.rename(new)
          for name in ['test/gen-world-data.js','test/narrative-targets.js','docs/narrative-target-registry.md']:
            p=Path(name);s=p.read_text();assert s.count('js/editor/core/narrative-targets.js')==1,name
            p.write_text(s.replace('js/editor/core/narrative-targets.js','js/editor/apply/narrative-targets.js'))
          p=Path('test/scene-objects-equality.js');s=p.read_text()
          assert s.count("'editor', 'core'")==3
          p.write_text(s.replace("'editor', 'core'","'editor', 'apply'"))
          for name in ['test/objective-resolver.js','test/objective-notebook-visibility.js']:
            p=Path(name);s=p.read_text();needle="require(path.resolve(__dirname, '../js/narrative-runtime.js'));"
            assert s.count(needle)==1 and 'scene-objects.gen.js' not in s,name
            p.write_text(s.replace(needle,"require(path.resolve(__dirname, '../js/scene-objects.gen.js'));\n"+needle))
          p=Path('docs/narrative-target-registry.md')
          s=p.read_text()+"\nReview correction: this generation-only CommonJS compiler belongs with Node apply tooling, not browser core (whose manifest requires every core module to load in world-builder.html). It moved to js/editor/apply without weakening the loader invariant or shipping an unused browser script. Two objective fixtures now load the real generated registry before enabling the adapter; their assertions are unchanged. All 100 maintained Node commands are rerun, not only the new target tests.\n"
          p.write_text(s)
          PY
          node test/gen-world-data.js
          git diff --exit-code -- js/scene-objects.gen.js js/world-connections.gen.js
          node test/narrative-targets.js
          node test/narrative-targets-apply.js
      - name: Complete maintained Node sweep
        run: |
          node - <<'JS'
          const fs=require('node:fs'),{spawnSync}=require('node:child_process');
          const src=fs.readFileSync('.github/workflows/test.yml','utf8');
          const tests=[...src.matchAll(/^\s+run: node (test\/[A-Za-z0-9_./-]+\.js)\s*$/gm)].map(m=>m[1]);
          if(tests.length!==100)throw new Error('Maintained manifest changed');
          let failed=0;for(const file of tests){const r=spawnSync(process.execPath,[file],{encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
            console.log((r.status===0?'PASS ':'FAIL ')+file);if(r.status!==0){failed++;console.log(r.stdout||'',r.stderr||'',r.error||'');}}
          if(failed)process.exitCode=1;
          JS
      - name: Commit only reviewed packaging and fixture changes
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/codex/world-01-narrative-targets | cut -f1)
          test "$actual" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- js/editor/core/narrative-targets.js js/editor/apply/narrative-targets.js test/gen-world-data.js test/narrative-targets.js test/scene-objects-equality.js test/objective-resolver.js test/objective-notebook-visibility.js docs/narrative-target-registry.md
          git diff --cached --check
          git commit -m 'fix(editor): package target compiler for Node and load registry in objective fixtures'
          git push origin HEAD:refs/heads/codex/world-01-narrative-targets
