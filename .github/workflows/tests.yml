      - name: Narrative M9 runtime
        run: node test/narrative-m9-runtime.js
      - name: Narrative repair contract
        run: node test/narrative-repair-contract.js
      - name: Narrative vertical slice 01
        run: node test/narrative-slice-01.js
      - name: M5 static validator
        run: node test/narrative-validate-m5.js
      - name: M6 static validator
        run: node test/narrative-validate-m6.js
      - name: M8 static validator
        run: node test/narrative-validate-m8.js
      - name: Story truth lint
        run: node test/story-truth-lint.js
      - name: Letter chain provenance
        run: node test/letter-chain-provenance.js
