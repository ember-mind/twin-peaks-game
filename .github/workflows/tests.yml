# Consolidated Node gate. Replaces test.yml and every Node-only command that
# the eleven single-purpose playable-* workflows used to run.
# The release subset is reported by tools/run-release-tests.js --list.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: World Builder data + UI layer (M1-M4b)
        run: node test/world-builder.js
      - name: Editor core - changeset (v1 + v2 create/delete)
        run: node test/editor/changeset.js
      - name: Editor core - edit (incl. create/delete drafts, door gating, paired/one-way conversion)
        run: node test/editor/edit.js
      - name: Editor core - cast placement (M7)
        run: node test/editor/cast.js
      - name: Editor core - scene objects (M8)
        run: node test/editor/scene-objects.js
      - name: Editor core - history
        run: node test/editor/history.js
      - name: Editor core - hit-test
        run: node test/editor/hit-test.js
      - name: Editor core - identity
        run: node test/editor/identity.js
      - name: Editor core - inspector
        run: node test/editor/inspector.js
      - name: Editor core - interaction
        run: node test/editor/interaction.js
      - name: Editor core - model
        run: node test/editor/model.js
      - name: Editor core - world-builder-core
        run: node test/editor/world-builder-core.js
      - name: World door equality (all maps vs pre-M5 fixture)
        run: node test/world-door-equality.js
      - name: Legacy door inventory (0 classic doors)
        run: node test/legacy-door-inventory.js
      - name: Scene objects inventory (0 entries left in js/maps.js)
        run: node test/scene-objects-inventory.js
      - name: Scene objects equality (all maps vs pre-M8 fixture)
        run: node test/scene-objects-equality.js
      - name: Location connections (paired, one-way, needsClues)
        run: node test/location-connections.js
      - name: Migrated door traversal (real engine input)
        run: node test/migrated-door-traversal.js
      - name: World connection registry
        run: node test/test-world-registry.js
      - name: Apply changeset pipeline
        run: node test/apply-changeset.js
      - name: Editor apply preflight
        run: node test/editor-apply-preflight.js
      - name: Editor runtime isolation
        run: node test/editor-runtime-isolation.js
      - name: World apply CLI (create/delete + catalog write, rollback, temp fixture)
        run: node test/world-apply.js
      - name: Catalog writer (js/world-catalog.js text rewrite)
        run: node test/catalog-write.js
      - name: World apply CLI - cast placement, --repin, bundle, rollback (M7, temp fixture)
        run: node test/world-apply-cast.js
      - name: World apply CLI - scene objects, delete guard, bundle, rollback (M8, temp fixture)
        run: node test/world-apply-objects.js
      - name: Cast continuity validators
        run: node test/cast-continuity-validate.js
      - name: Cast presence sync
        run: node test/cast-presence-sync.js
      - name: World engine v0.1 catalog
        run: node test/world-engine-v0.1-catalog.js
      - name: M9 static validator (Cast Presence actors)
        run: node test/narrative-validate-m9.js
      - name: M10 static validator (confession lock verbatim)
        run: node test/narrative-validate-m10.js
      - name: Act 5 flow (M9 reason codes + M10 matrix, runtime)
        run: node test/act-5-flow.js
      - name: Act 5 mirror gate (mission / classic / finale ownership)
        run: node test/act-5-mirror-gate.js
      - name: Act 2 flow (M4 runtime + classic path on Cast Presence bodies)
        run: node test/act-2-flow.js
      - name: Act 2 Ronette required gate
        run: node test/act-2-ronette-required.js
      - name: Act 3 flow
