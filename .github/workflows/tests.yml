      - name: R69 reference gates
        run: node test/r69-reference-gates.js
      - name: Graphic pass contract
        run: node test/graphic-pass-contract.js
      - name: Retro font
        run: node test/retro-font.js
      - name: Retro production
        run: node test/retro-production.js
      - name: Mobile production
        run: node test/mobile-production.js
      - name: Touch runtime
        run: node test/touch-runtime.js
      - name: Movement feel
        run: node test/movement-feel.js
      - name: Walk phase contract
        run: node test/walk-phase-contract.js
      - name: Initial spawn
