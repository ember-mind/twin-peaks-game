      - name: Hospital native scene
        run: node test/hospital-native.js
      - name: Room 315 location
        run: node test/room-315-location.js
      - name: Room 315 native scene
        run: node test/room-315-native.js
      - name: Sheriff's station location
        run: node test/sheriffs-station-location.js
      - name: Sheriff's station native scene
        run: node test/sheriffs-station-native.js
      - name: Sheriff's station door
