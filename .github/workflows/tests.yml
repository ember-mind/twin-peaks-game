      - name: Narrative lint
        run: node test/narrative-lint.js
      - name: Project smoke gate
        run: node test/smoke.js
      - name: Project walkthrough gate
        run: node test/walkthrough.js
      - name: Turn, held movement, between-frame input and phone targeting
        run: node test/turn-in-place.js
      - name: Classic evidence bridge (earned inventory, idempotent repair, deductions)
        run: node test/classic-evidence-bridge.js
      - name: Finale completion persistence (terminal write, rollback, retry)
        run: node test/finale-completion-persistence.js
      - name: Campaign player contract
        run: node test/campaign-player.js
      - name: Campaign report safety
        run: node test/campaign-report-safety.js
      - name: Campaign recovery checker
        run: node test/campaign-recovery.js
      - name: Classic-to-narrative cast parity
        run: node test/classic-cast-sync.js
      - name: Regenerate world data from canonical sources
        run: node test/gen-world-data.js
      - name: Generated world data matches canonical sources
        run: git diff --exit-code -- js/scene-objects.gen.js js/world-connections.gen.js
      - name: Narrative target identity, parity and failure contracts
        run: node test/narrative-targets.js
      - name: Narrative targets editor move, reverse move and referenced delete rollback
        run: node test/narrative-targets-apply.js
      - name: Notebook exit and nested touch ownership
        run: node test/touch-notebook-navigation.js
      - name: Playable browser-boundary contracts
        run: node test/playable-browser.js
      - name: Touch gesture transport geometry
        run: node test/touch-gesture-transport.js
      - name: Touch preflight contracts
        run: node test/touch-preflight.js
      - name: Release runner contracts including failed and timed-out fixtures
        run: node test/release-runner.js

  release-baseline:
    # On-demand reproduction with a machine-readable evidence artifact. The
    # per-test steps above already run the same suite on every push/PR, so this
    # job is not repeated on routine triggers.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproduce the existing Node release suite with evidence
        shell: bash
        run: node tools/run-release-tests.js --out="$RUNNER_TEMP/release-baseline"
      - name: Preserve baseline and individual logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-baseline
          retention-days: 7
          if-no-files-found: error
