      - name: Dialogue presentation (HTML panel)
        run: node test/dialogue-presentation.js
      - name: Interaction voice
        run: node test/interaction-voice.js
      - name: Classic object grounding
        run: node test/classic-object-grounding.js
      - name: Environmental interactions
        run: node test/environmental-interactions.js
      - name: Environment entry
        run: node test/environment-entry.js
      - name: Environment life
        run: node test/environment-life.js
      - name: Ambient life
        run: node test/ambient-life.js
      - name: Character activity
        run: node test/character-activity.js
      - name: Character quality
        run: node test/character-quality.js
      - name: Character runtime contract
        run: node test/character-runtime-contract.js
      - name: Cast sprite sheet
        run: node test/cast-sprite-sheet.js
      - name: Cooper sprite sheet
