<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kit Map Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #14171a; --panel: #1c2024; --edge: #30363c; --fg: #e8e2d2; --dim: #9a9484; --gold: #e9b458; --ok: #8fc27a; --bad: #e07a5f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 250px 1fr 260px; height: 100vh; overflow: hidden; }
  aside { background: var(--panel); border-right: 1px solid var(--edge); overflow-y: auto; padding: 10px; }
  aside.right { border-right: 0; border-left: 1px solid var(--edge); }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 0 6px; }
  h2:first-child { margin-top: 0; }
  main { position: relative; overflow: auto; background: #0d0f11; }
  canvas#map { image-rendering: pixelated; display: block; margin: 12px; cursor: crosshair; }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  button, select, input { background: #262a2e; color: var(--fg); border: 1px solid #3a3f44; padding: 5px 8px; border-radius: 4px; font: inherit; }
  button.on { background: #3d5f88; border-color: #5a7fae; }
  button:disabled { opacity: .4; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .swatch { border: 1px solid var(--edge); border-radius: 4px; padding: 3px; cursor: pointer; text-align: center; font-size: 10px; color: var(--dim); overflow: hidden; }
  .swatch.on { border-color: var(--gold); color: var(--fg); }
  .swatch canvas { image-rendering: pixelated; display: block; margin: 0 auto 2px; max-width: 100%; }
  #objFilter { width: 100%; margin-bottom: 6px; }
  .list { font-variant-numeric: tabular-nums; }
  .list div { padding: 2px 0; border-bottom: 1px solid #262a2e; display: flex; justify-content: space-between; gap: 6px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; flex-wrap: wrap; }
  #hint { color: var(--dim); font-size: 12px; min-height: 2.8em; }
  kbd { background: #262a2e; border: 1px solid #3a3f44; border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
<aside>
  <h2>Tool</h2>
  <div class="tools" id="tools">
    <button data-tool="paint">Paint</button>
    <button data-tool="place">Place</button>
    <button data-tool="move">Move</button>
    <button data-tool="erase">Delete</button>
    <button data-tool="place-name">Name door</button>
    <button data-tool="spot">Spot</button>
    <button data-tool="walk">Walkable</button>
    <button data-tool="block">Blocked</button>
    <button data-tool="clear">Clear cell</button>
  </div>
  <div class="row"><label>Brush <select id="brush"><option>1</option><option>2</option><option selected>3</option><option>5</option></select></label></div>
  <p id="hint"></p>
  <h2>Ground</h2>
  <div class="grid" id="materials"></div>
  <h2>Objects</h2>
  <input id="objFilter" placeholder="filter: lamp, tree, bench…">
  <div class="grid" id="objects"></div>
</aside>
<main><canvas id="map"></canvas></main>
<aside class="right">
  <h2>Map</h2>
  <div class="row"><span id="mapName"></span></div>
  <div class="row"><button id="undo">Undo</button><button id="redo">Redo</button><button id="export">Export JSON</button></div>
  <div class="row"><label>Size <input id="mw" type="number" min="8" max="200" style="width:56px"> × <input id="mh" type="number" min="8" max="200" style="width:56px"></label><button id="resize">Resize</button></div>
  <h2>Light</h2>
  <div class="row"><input id="time" type="range" min="0" max="1439" step="1" value="1167" style="width:100%"></div>
  <div class="row"><span id="clock"></span><label><input type="checkbox" id="debug" checked> collision</label></div>
  <h2>Check</h2>
  <div class="list" id="check"></div>
  <h2>Places</h2>
  <div class="list" id="places"></div>
  <h2>Selection</h2>
  <div class="list" id="sel"></div>
  <p style="color:var(--dim);font-size:12px;margin-top:16px"><kbd>⌘Z</kbd> undo · <kbd>⇧⌘Z</kbd> redo · <kbd>Del</kbd> delete selection · arrows nudge · <kbd>1</kbd>–<kbd>9</kbd> tools</p>
</aside>

<script src="../ember-math.js"></script>
<script src="../ember-viewport.js"></script>
<script src="../ember-ground.js"></script>
<script src="../ember-worldmap.js"></script>
<script src="../ember-worldview.js"></script>
<script src="kit-editor.js"></script>
<script>if (/[?&]selftest=1/.test(location.search)) document.write('<script src="kit-editor-selftest.js"><\/script>');</script>
</body>
</html>
