<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TWIN PEAKS — Il Mistero di Laura Palmer</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; touch-action: none; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  #gl { background: #000; }
  #game { background: transparent; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
  }
  #grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 6; opacity: 0.06;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="960" height="640"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
  <canvas id="game" width="480" height="320"></canvas>
</div>
<!-- Script classici, nessun modulo ES: funziona da file:// -->
<script src="js/vendor/three.min.js"></script>
<script src="js/tiles.js"></script>
<script src="js/chars.js"></script>
<script src="js/houses.js"></script>
<script src="js/maps.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/render3d.js"></script>
<script src="js/glue.js"></script>
<script src="js/main.js"></script>
<script src="js/touch.js"></script>
<script src="js/audio.js"></script>
</body>
</html>
