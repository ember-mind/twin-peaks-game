    box-shadow: 0 8px 25px rgba(0,0,0,.35);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 12px;
    font-weight: 750;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  #dialogue-speaker::before {
    content: "";

    left: 8px;
    top: 9px;
    bottom: 8px;
    width: 3px;
    background: #a44d61;
  }
  #dialogue-text {
    font-size: clamp(18px, 1.7vw, 22px);
    font-weight: 500;
    line-height: 1.5;
    letter-spacing: .005em;
    text-shadow: 0 2px 12px rgba(0,0,0,.58);
  }
  #dialogue-next {
    position: absolute;
    right: 25px;

    color: #d9ba75;

  #dialogue-context {
    position: absolute;
    top: 10px;

  #grade {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
    background:
      radial-gradient(ellipse at 48% 38%, rgba(255,222,170,0.10), transparent 48%),

  }
  #grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 6; opacity: 0.028;

    background-size: 96px 96px;
  }
  /* Produzione retro 2D: viewport GBC nativo 160x144 (10:9), pixel netti. */
  html, body { background: #111913; }
  #stage {
    inset: auto;
    left: 50%; top: 50%;
    width: min(100vw, 111.1111vh);
    height: min(100vh, 90vw);
    max-width: 100vw; max-height: 100dvh;
    aspect-ratio: 10 / 9;
    overflow: hidden;
    transform: translate(-50%, -50%);
    background: #17261d;
    box-shadow: 0 0 0 2px #4f6747, 0 16px 60px rgba(0,0,0,.72);

  }
  #game {
    display: block;
    width: 100%; height: 100%;
    object-fit: fill;
    object-position: center;
    opacity: 1 !important;
    image-rendering: pixelated !important;
    image-rendering: crisp-edges !important;
  }
  /* Volti speaker conservano risoluzione ImageGen sul compositor. Mondo e

    position: absolute;
    z-index: 8;
    left: 8.125%;
    top: 42.361111%;
    width: 20%;
    height: 22.916667%;
    display: block;
    object-fit: fill;
    image-rendering: auto;
    pointer-events: none;
  }
  #speaker-portrait-hires[hidden] { display: none; }
  /* Testo dialogo composto a risoluzione display. Sotto resta il bitmap
     nativo come fallback; fondi crema coprono soltanto i vecchi glifi. */
  #speaker-name-hires,
  #speaker-dialogue-hires {
    position: absolute;
    z-index: 9;
    color: #072619;
    background: #eee6b5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-weight: 700;

    pointer-events: none;
    overflow: hidden;

    left: 6.875%;
    top: 67.361111%;
    width: 22.5%;
    height: 4.861111%;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    font-size: calc(var(--native-scale) * 4px);
    line-height: 1;
  }
  #speaker-dialogue-hires {
    left: 6.875%;
    top: 77.083333%;
    width: 86.25%;
    height: 12.5%;

    line-height: 1;
    letter-spacing: calc(var(--native-scale) * 0.08px);
  }
  #speaker-dialogue-hires .speaker-line {
    position: absolute;
    left: 0;
    width: 100%;
    white-space: nowrap;
  }
  #speaker-dialogue-hires .speaker-line:first-child { top: 0; }
  #speaker-dialogue-hires .speaker-line:last-child { top: 61.111111%; }
  #speaker-name-hires[hidden],
  #speaker-dialogue-hires[hidden] { display: none; }
  #presentation, #gl, #grade, #vignette, #grain,
  #cinematic-ui, #dialogue-ui { display: none !important; }
  #narrative {
    position: absolute; inset: 0; z-index: 12; pointer-events: none;
    font-family: ui-monospace, Menlo, Monaco, "Courier New", monospace;
  }
  /* DOM resta semantico/accessibile; retro-ui.js lo dipinge pixel-per-pixel. */
  .retro-semantic-ui { opacity: 0 !important; pointer-events: none !important; }
  #retro-ui-canvas {
    position: absolute; inset: 0; z-index: 14;
    width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #narrative .nw-root { pointer-events: auto; }
  .nw-root {
    position: absolute; left: 2.5%; right: 2.5%; bottom: 2.5%;
    box-sizing: border-box;
    max-height: 74%; overflow: auto;
    padding: clamp(10px, 1.8vh, 18px) clamp(13px, 2.1vw, 24px);
    color: #17261d; background: #f4f0d2;
    border: clamp(3px, .5vh, 6px) double #17261d;
    box-shadow: .5vh .7vh 0 rgba(23,38,29,.82);
    font-size: clamp(15px, 2.25vh, 23px); line-height: 1.38;

  .nb-root { top: 4%; bottom: 4%; max-height: none; }
  .nw-title { color: #36543b; font-weight: 800; margin-bottom: .55em; }
  .nw-opt { padding: .12em .35em; white-space: pre-wrap; }
  .nw-focus { color: #f4f0d2; background: #36543b; }

  .nw-hint { color: #526b46; text-align: right; margin-top: .55em; }
  #objective {

  /* Fascicolo leggibile a risoluzione schermo. Il mondo resta 160×144;

  #case-ui {
    position: absolute; inset: 0; z-index: 20;
    display: none; align-items: center; justify-content: center;
    box-sizing: border-box; padding: clamp(8px, 1.8vh, 18px);

  body[data-menu="true"] #case-ui { display: flex; }
  #case-panel {

  #case-objective {

  body[data-case-view="document"] #case-objective,

    padding: .1em .42em; color: #fffdf0; background: #294c34;

  @media (max-height: 560px) {
    #case-ui { font-size: 11px; padding: 8px; }

  @media (max-width: 560px) {
    #case-ui { padding: 6px; font-size: 12px; }

    #case-document-copy { line-height: 1.45; }

  }
  .tp-touch-ctrl {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
</style>
