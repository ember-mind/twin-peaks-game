<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Town Map Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #14171a; --fg: #e8e2d2; --dim: #9a9484; --ok: #8fc27a; --bad: #e07a5f; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { padding: 12px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
  button, select { background: #262a2e; color: var(--fg); border: 1px solid #3a3f44; padding: 4px 10px; border-radius: 4px; font: inherit; }
  button.on { background: #3d5f88; }
  canvas { image-rendering: pixelated; display: block; cursor: pointer; }
  #stats { color: var(--dim); font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <div class="bar">
    <button id="bOverview" class="on">Overview</button>
    <button id="bFollow">Follow</button>
    <label>Walk speed <select id="speed">
      <option value="64">4 tiles / town min (old table)</option>
      <option value="320" selected>20 tiles / town min</option>
      <option value="960">60 tiles / town min (real pace)</option>
    </select></label>
    <label>Clock <select id="rate">
      <option value="0.1">6x (live: 1 min / 10 s)</option>
      <option value="1" selected>1 town min / s</option>
      <option value="5">5 town min / s</option>
    </select></label>
    <span id="stats"></span>
  </div>
  <canvas id="overview"></canvas>
  <canvas id="follow" style="display:none"></canvas>
  <p id="caption" style="margin:8px 0 0;color:#e9b458;font:600 15px/1.3 system-ui,sans-serif;letter-spacing:.02em"></p>
</main>

<script src="../../../engine/ember-math.js"></script>
<script src="../../../engine/ember-grid.js"></script>
<script src="../../../engine/ember-camera.js"></script>
<script src="../../../engine/ember-tilemap.js"></script>
<script src="../../../engine/ember-viewport.js"></script>
<script src="../../js/lt-util.js"></script>
<script src="../../js/lt-names.js"></script>
<script src="../../js/lt-appearance.js"></script>
<script src="../../js/lt-production-host.js"></script>
<script src="../../../engine/ember-pixel.js"></script>
<script src="../../../engine/ember-interior-kit.js"></script>
<script src="../../../js/retro-authored.js"></script>
<script src="../../../js/retro-font.js"></script>
<script src="../../content/activity-poses-v01/activity-poses.table.js"></script>
<script src="../../content/activity-poses-v01/lt-activity-poses.js"></script>
<script src="../town-kit/ground/pick.js"></script>
<script src="town-core.js"></script>
<script src="page.js"></script>

</body>
</html>
