<!doctype html><meta charset="utf-8"><title>Double R — Ambient Life preview</title>
<style>body{margin:0;background:#17251e;color:#f4e6c8;font:14px monospace;text-align:center}header{padding:12px}button,a{color:inherit;background:#35271f;border:1px solid #946345;padding:7px;cursor:pointer}iframe{display:block;border:0;width:min(100vw,1024px);height:min(75vw,768px);margin:8px auto}p{font-size:12px}</style>
<header>DOUBLE R · ENVIRONMENT LIFE 02 <button id="pause">Pause</button> <button id="static">Static</button> <button id="ambient">Ambient life</button> <button id="reactive">Reactive only</button> <button id="entry">Trigger entry event</button> <button id="sip">Prova sorso</button> <button id="wipe">Prova pulizia</button> <button id="lights">Prova luci</button> <button id="neon">Prova insegna</button> <button id="glass">Prova riflesso</button> <strong id="mode-status" aria-live="polite">Tutto attivo</strong> <span id="clock"></span></header>
<iframe id="game" src="../index.html?ambient-preview=1" allow="autoplay"></iframe>
<section id="effect-detail" hidden><strong id="effect-label"></strong><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px"><figure>Prima<br><canvas id="effect-before" width="64" height="40" style="width:min(80vw,512px);height:auto;image-rendering:pixelated"></canvas></figure><figure>Durante · tempo reale<br><canvas id="effect-live" width="64" height="40" style="width:min(80vw,512px);height:auto;image-rendering:pixelated"></canvas></figure></div></section>
<p>Lampade: calo e ritorno della luce. Insegna: variazione della grande R. Vetrina: riflesso in movimento sul vetro.</p>
<p>Production renderer · native 256×192 · steam / lamps / neon / glass / machine / clock · event-driven door</p>
<script>
(async function(){
 const frame=document.querySelector('iframe'),q=new URLSearchParams(location.search);
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 while(!frame.contentWindow.GAME?.Engine?.state||!frame.contentWindow.GAME?.AmbientLife)await wait(30);
 const w=frame.contentWindow,G=w.GAME,s=G.Engine.state;
 s.mode='play';s.dialogue=null;G.Engine.loadMap('diner',6,8,'up');s.dialogue=null;s.fade=0;
 // Evidence isolates environment motion; production NPC behavior is unchanged.
 s.npcs.forEach(n=>{n.nextThink=Infinity;n.dir='down';});
 const actors=G.CharacterActivity;actors.reset(1989);actors.update(0,s);
 const reactions=G.EnvironmentReactions;reactions.reset('diner');
 const entry=()=>G.Engine.emitEnvironmentEvent({type:'ENTITY_ENTERED_DOORWAY',sceneId:'diner',arrivalKey:'6,8',fromMapId:'town',entityId:'preview-entity'});
 const life=G.AmbientLife;life.reset(1989);life.update(0,'diner');
 let paused=false, demoTimer=null, demoToken=0;
 function cancelDemo(){demoToken++;clearInterval(demoTimer);demoTimer=null;document.querySelector('#effect-detail').hidden=true;}
 const status=document.querySelector('#mode-status');
 function setPaused(value){paused=value;life.setPaused(value);reactions.setPaused(value);actors.setPaused(value);document.querySelector('#pause').textContent=value?'Resume':'Pause';}
 function mode(ambient,reactive){
  cancelDemo();
  actors.setEnabled(ambient);life.setEnabled(ambient);reactions.setEnabled(reactive);reactions.reset('diner');
  status.textContent=ambient?'Tutto attivo':reactive?'Solo porta — ambiente spento':'Statico — animazioni spente';
 }
 function resumeAll(){mode(true,true);setPaused(false);}
 document.querySelector('#pause').onclick=()=>{cancelDemo();setPaused(!paused);};
 document.querySelector('#sip').onclick=()=>{resumeAll();actors.play('booth-sip');};
 document.querySelector('#wipe').onclick=()=>{resumeAll();actors.play('counter-wipe');};
 document.querySelector('#static').onclick=()=>mode(false,false);
 document.querySelector('#ambient').textContent='Tutto attivo';
 document.querySelector('#ambient').onclick=resumeAll;
 document.querySelector('#reactive').onclick=()=>mode(false,true);
 document.querySelector('#entry').onclick=()=>{resumeAll();entry();};
 async function showAmbient(id,label){
  resumeAll();
  const token=demoToken;
  const event=life.snapshot('diner').items.find(e=>e.id===id);
  const start=event.next;
  life.setPaused(true);
  life.seek('diner',start);
  const duration=life.snapshot('diner').items.find(e=>e.id===id).duration;
  const anchor={ 'pendant-middle':[67,5], 'double-r-neon':[104,-4], 'pie-glass':[151,39] }[id];
  const x=anchor[0]-(s.map.width*16-256)/2-32,y=anchor[1]-(s.map.height*16-192)/2-16;
  function copy(target){
   const out=document.querySelector(target).getContext('2d');
   out.imageSmoothingEnabled=false;
   out.drawImage(w.document.querySelector('#game'),x,y,64,40,0,0,64,40);
  }
  const rendered=()=>wait(120);
  life.seek('diner',start-1);
  await rendered();if(token!==demoToken)return;
  copy('#effect-before');
  document.querySelector('#effect-detail').hidden=false;
  document.querySelector('#effect-label').textContent=label+' · dettaglio 8× · intensità originale';
  status.textContent='Prova in tempo reale · '+label+' · 3 cicli';
  let elapsed=0;
  demoTimer=setInterval(()=>{
   elapsed+=50;
   // Three cycles with a short rest. Production speed and intensity are preserved.
   const cycle=duration+600, phase=elapsed%cycle;
   life.seek('diner',phase<duration?start+phase:start-1);
   copy('#effect-live');
   if(elapsed>=cycle*3){clearInterval(demoTimer);demoTimer=null;life.setPaused(false);status.textContent='Tutto attivo · prova terminata';}
  },50);
 }
 document.querySelector('#lights').onclick=()=>showAmbient('pendant-middle','lampada centrale');
 document.querySelector('#neon').onclick=()=>showAmbient('double-r-neon','insegna');
 document.querySelector('#glass').onclick=()=>showAmbient('pie-glass','riflesso vetrina');
 setInterval(()=>document.querySelector('#clock').textContent=(life.snapshot('diner').time/1000).toFixed(1)+'s',100);
 const cv=w.document.querySelector('#game');
 await wait(500);
 if(q.get('record')==='1'){
  life.setPaused(true);reactions.setPaused(true);actors.setPaused(true);window.__TP_SHOT_FRAMES__=[];window.__AMBIENT_TIMELINE__=[];
  const gestures=q.get('clip')==='gestures';
  const doorOnly=q.get('clip')==='door';if(doorOnly)life.setEnabled(false);
  const duration=gestures?8000:doorOnly?3000:Math.min(60000,Math.max(30000,Number(q.get('seconds')||30)*1000));
  const step=doorOnly?40:100;
  for(let t=0;t<duration;t+=step){
   life.seek('diner',gestures?0:t);
   actors.seek(t);
   if(gestures){actors.preview('booth-sip',t>=500?t-500:3000);actors.preview('counter-wipe',t>=4000?t-4000:3000);}
   actors.setPaused(false);actors.update(0,s);actors.setPaused(true);
   reactions.setPaused(false);reactions.update(step,'diner');reactions.setPaused(true);
   if(!gestures && t===(doorOnly?400:2000))entry();
   await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));
   window.__TP_SHOT_FRAMES__.push(cv.toDataURL('image/png'));
   window.__AMBIENT_TIMELINE__.push({ambient:life.snapshot('diner'),reactions:reactions.snapshot('diner')});
  }
  document.title='TP-SHOT-READY AMBIENT '+window.__TP_SHOT_FRAMES__.length+' frames / '+duration/1000+' seconds';
 }else document.title='TP-SHOT-READY Double R Ambient Life';
})();
</script>
