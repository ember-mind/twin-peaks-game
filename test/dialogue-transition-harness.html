<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TP-DIALOGUE-PENDING</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
<script>
try { localStorage.removeItem('tp_save'); } catch (_) {}
</script>
</head>
<body>
<iframe id="production" src="../index.html" title="Twin Peaks production build"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var atMs = +(q.get('at') || 0);
  if ([0, 16, 50, 150, 300, 600].indexOf(atMs) < 0) {
    document.title = 'TP-DIALOGUE-ERROR-invalid-time';
    return;
  }
  var frame = document.getElementById('production');

  function fail(error) {
    window.__TP_SHOT_ERROR__ = String(error && error.stack || error);
    document.title = 'TP-DIALOGUE-ERROR';
  }

  function waitForRuntime(win, deadline) {
    if (win.GAME && win.GAME.Engine && win.GAME.Engine.state &&
        win.GAME.Render3D && win.document.body) {
      return Promise.resolve();
    }
    if (performance.now() > deadline) {
      return Promise.reject(new Error('production runtime timeout'));
    }
    return new Promise(function (resolve) {
      setTimeout(resolve, 25);
    }).then(function () { return waitForRuntime(win, deadline); });
  }

  function freeze(win) {
    var E = win.GAME.Engine;
    // Stop future simulation submissions. Pixels and DOM reached at the exact
    // checkpoint stay visible while CDP polls the outer ready title.
    win.requestAnimationFrame = function () { return 0; };
    if (win.GAME.Render3D) win.GAME.Render3D.render = function () {};
    var animations = win.document.getAnimations ? win.document.getAnimations() : [];
    animations.forEach(function (animation) { animation.pause(); });
    var dialogueUi = win.document.getElementById('dialogue-ui');
    var gameCanvas = win.document.getElementById('game');
    window.__TP_DIALOGUE_META__ = {
      ready: true,
      atMs: atMs,
      map: E.state.mapId,
      player: [E.state.player.tx, E.state.player.ty, E.state.player.dir],
      dialogueState: !!E.state.dialogue,
      htmlDialogueActive: win.document.body.getAttribute('data-dialogue') === 'true',
      htmlDialogueOpacity: dialogueUi ? win.getComputedStyle(dialogueUi).opacity : null,
      legacyCanvasOpacity: gameCanvas ? win.getComputedStyle(gameCanvas).opacity : null,
      speaker: (win.document.getElementById('dialogue-speaker') || {}).textContent || '',
      text: (win.document.getElementById('dialogue-text') || {}).textContent || ''
    };
    document.title = 'TP-DIALOGUE-READY-' + String(atMs).padStart(3, '0');
  }

  frame.addEventListener('load', function () {
    var win = frame.contentWindow;
    waitForRuntime(win, performance.now() + 12000).then(function () {
      var E = win.GAME.Engine;
      var seed = 104729;
      win.Math.random = function () {
        seed = (seed + 0x6d2b79f5) >>> 0;
        var z = seed;
        z = Math.imul(z ^ (z >>> 15), z | 1);
        z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
        return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
      };
      E.state.mode = 'play';
      E.state.flags.intro_town = true;
      // Genuine production interaction path: Cooper immediately west of
      // Truman, matching test/dialogue-presentation.js.
      E.loadMap('sheriff', 6, 1, 'right');

      // Settle authored room/character assets before defining Enter as t=0.
      setTimeout(function () {
        win.dispatchEvent(new win.KeyboardEvent('keydown', {
          code: 'Enter',
          bubbles: true,
          repeat: false
        }));
        win.dispatchEvent(new win.KeyboardEvent('keyup', {
          code: 'Enter',
          bubbles: true
        }));
        setTimeout(function () {
          try { freeze(win); } catch (error) { fail(error); }
        }, atMs);
      }, 1100);
    }).catch(fail);
  });
})();
</script>
</body>
</html>
