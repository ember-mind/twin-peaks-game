<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HD-2D Cabin Prototype</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080c0c;color:#ded8c5;font-family:Georgia,serif}
    body{display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 26%,#1b2724 0,#0a0e0e 52%,#050707 100%)}
    main{width:min(100%,1010px)}
    header{display:flex;align-items:end;justify-content:space-between;margin:0 4px 12px;border-bottom:1px solid #7f6f5038;padding-bottom:9px}
    .eyebrow{font:600 9px/1.2 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#a99a73}
    h1{font-size:clamp(17px,2.3vw,25px);font-weight:400;letter-spacing:.04em;margin:4px 0 0;color:#eee6ce}
    #state{font:600 10px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#e2bc72;border:1px solid #9b7948;padding:7px 9px;background:#171714}
    #frame{position:relative;aspect-ratio:16/10;overflow:hidden;border:1px solid #6d634c;background:#0b1110;box-shadow:0 22px 75px #000c,0 0 0 5px #0e1211,0 0 0 6px #4c4637}
    canvas{display:block;width:100%;height:100%;image-rendering:auto}
    #grain{pointer-events:none;position:absolute;inset:0;opacity:.15;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
    #vignette{pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 100px 15px #06100ac9,inset 0 -50px 80px #02040385}
    footer{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 0;color:#8f8c7d;font:10px/1.4 system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase}
    .keys{display:flex;gap:9px}.keys span{white-space:nowrap}.key{color:#d6cbaa;border:1px solid #4e5148;border-radius:2px;padding:3px 5px;background:#111514}
    .switch{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #565649;background:#121716;color:#bcb7a4;padding:7px 10px;font:600 9px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}button.active{color:#f0ce85;border-color:#a27f45;background:#292317}
    @media(max-width:650px){body{padding:10px}header{margin-bottom:8px}footer{align-items:flex-start;gap:8px;flex-direction:column}.hint{display:none}}
  </style>
</head>
<body>
  <main>
    <header><div><div class="eyebrow">Throwaway visual prototype · Twin Peaks</div><h1 id="title">Pine Clearing, 6:47 PM</h1></div><div id="state">Loading diorama</div></header>
    <section id="frame" aria-label="Interactive forest cabin and town diorama"><div id="grain"></div><div id="vignette"></div></section>
    <footer>
      <div class="keys"><span><b class="key">WASD</b> walk</span><span><b class="key">R</b> reset</span><span class="hint"><b class="key">Space</b> compare light</span></div>
      <div class="switch"><button data-location="cabin">Cabin</button><button data-location="diner">Double R</button><button data-location="sheriff">Sheriff</button><button data-variant="flat">Flat baseline</button><button data-variant="hd2d">HD-2D depth</button></div>
    </footer>
  </main>
  <script src="../js/vendor/three.min.js"></script>
  <script src="hd2d-cabin-prototype.js"></script>
</body>
</html>
