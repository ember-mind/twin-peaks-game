<body>

<script>
/* C8-D SCREEN TRUTH — M8. Record FORMALI presi dalla UI VERA, congelati
 * PRIMA del commit: page_id (o record_type:choice_menu), visible_text letto dal
 * DOM VISIBILE, state_before, state_after, lease attivo pre-commit.
 *
 * Boot: STESSO path del participant (playtest.html) — narrative-bootstrap.js
 * caricato e installNarrativeCatalogs() chiamato PRIMA di qualunque
 * deserialize / A.enable. Nessun cablaggio manuale dei domini nell'harness.
 *
 * Screen truth = testo del DOM live. Gli screenshot PNG headless NON catturano
 * l'overlay DOM (lezione C6-D): la verità di schermo è il visible_text.
 *
 * 4 passaggi completi attraverso il motore vero:
 *   P1 accompagno / warning=palmer  / focus=palmer → hawk, valigia NELLA ROTTA
 *   P2 autonomia  / warning=palmer  / focus=lago   → cooper, valigia IN STAZIONE
 *   P3 prudenza   / warning=centrale/ focus=diner  → hawk, NESSUNA valigia
 *   P4 accompagno / warning=nessuno / focus=lago   → cooper, NESSUNA valigia
 * (entrambe le versioni cooper/hawk + le tre classi valigia + i tre valori di
 *  promise_stance, warning_target, focus_destination). */
var LOCK = 30;
var out = { checks: {}, records: [], errors: [], notes: [], console_log: [], run_log: {} };
window.__C8D_RESULT = out;
window.onerror = function (m, s, l) { out.errors.push(String(m) + ' @' + l); };
window.addEventListener('unhandledrejection', function (e) { out.errors.push('unhandled: ' + (e.reason && e.reason.message || e.reason)); });
(function () {
  ['log', 'warn', 'error'].forEach(function (lvl) {
    var orig = console[lvl];
    console[lvl] = function () {
      if (out.console_log.length < 500) out.console_log.push(lvl + ': ' + [].slice.call(arguments).map(String).join(' '));
      if (lvl === 'error') out.errors.push('console.error: ' + [].slice.call(arguments).map(String).join(' '));
      return orig.apply(console, arguments);
    };
  });
})();

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function key(c) { window.dispatchEvent(new KeyboardEvent('keydown', { code: c, bubbles: true })); window.dispatchEvent(new KeyboardEvent('keyup', { code: c, bubbles: true })); }

/* ------------- lettura del DOM VISIBILE (mai del DOM nascosto) -------------
 * Lezione C5-D: #narrative ospita più root (pagine, widget, taccuino) e quelle
 * non a schermo restano nel DOM con display:none. La screen truth legge SOLO
 * le root visibili. */
function visibleRoots() {
  var c = document.getElementById('narrative');
  if (!c) return [];
  return [].slice.call(c.children).filter(function (el) {
    return !(el.style && el.style.display === 'none');
  });
}
function visibleText() {
  return visibleRoots().map(function (el) { return el.textContent || ''; }).join(' ').replace(/\s+/g, ' ').trim();
}
function visiblePageEls() {
  var els = [];
  visibleRoots().forEach(function (r) {
    if (r.getAttribute && r.getAttribute('data-page-id')) els.push(r);
    [].slice.call(r.querySelectorAll('[data-page-id]')).forEach(function (o) { els.push(o); });
  });
  return els;
}
function pageIds() { return visiblePageEls().map(function (o) { return o.getAttribute('data-page-id'); }); }
function pageText(id) {
  var els = visiblePageEls().filter(function (o) { return o.getAttribute('data-page-id') === id; });
  return els.length ? (els[0].textContent || '').replace(/\s+/g, ' ').trim() : '';
}
function widgetRootText() {
  var r = visibleRoots().filter(function (el) { return el.className && el.className.indexOf('nw-root') >= 0 && el.className.indexOf('nb-root') < 0; });
  return r.length ? (r[0].textContent || '').replace(/\s+/g, ' ').trim() : visibleText();
}
function widgetOpts() {
  return [].map.call(document.querySelectorAll('.nw-root:not(.nb-root) .nw-opt'), function (o) { return o.getAttribute('data-choice-id'); });
}
/* pagine VISTE in questo passaggio + il loro testo a schermo (per le classi
 * valigia: una pagina condizionale si prova mostrandola, non deducendola) */
var seen = {}, seenText = {};
function snap() { visiblePageEls().forEach(function (o) { var id = o.getAttribute('data-page-id'); seen[id] = true; seenText[id] = (o.textContent || '').replace(/\s+/g, ' ').trim(); }); }
async function press(c) { key(c); await wait(LOCK + 45); snap(); }
async function advanceToPage(id, max) { snap(); for (var i = 0; i < (max || 40) && pageIds().indexOf(id) < 0; i++) await press('Enter'); return pageIds().indexOf(id) >= 0; }
async function advanceUntil(pred, max) { snap(); for (var i = 0; i < (max || 40); i++) { if (pred()) return true; await press('Enter'); } return pred(); }
async function chooseChoice(id) { var o = widgetOpts(), idx = o.indexOf(id); if (idx < 0) return false; for (var k = 0; k < idx; k++) await press('ArrowDown'); await press('Enter'); return true; }
/* taccuino REALE (stessi helper del C8-C harness): indici mai assunti, derivati */
function nbOpen() { return !!document.querySelector('.nb-root'); }
function nbVisible() { var r = document.querySelector('.nb-root'); return !!r && r.style.display !== 'none'; }
function nbItems(attr) { return [].slice.call(document.querySelectorAll('.nb-root [' + attr + ']')); }
function nbIds(attr) { return nbItems(attr).map(function (o) { return o.getAttribute(attr); }); }
function nbFocusIndex(list) { for (var i = 0; i < list.length; i++) if (list[i].className.indexOf('nw-focus') >= 0) return i; return -1; }
async function nbMoveTo(attr, value) {
  var list = nbItems(attr), ids = list.map(function (o) { return o.getAttribute(attr); });
  var target = ids.indexOf(value); if (target < 0) return false;
  var cur = nbFocusIndex(list); if (cur < 0) cur = 0;
  var steps = (target - cur + ids.length) % ids.length;
  for (var i = 0; i < steps; i++) await press('ArrowDown');
  return nbFocusIndex(nbItems(attr)) === target;
}
async function nbEnterSection(name) { if (!await nbMoveTo('data-nb-section', name)) return false; await press('Enter'); return true; }
async function nbPickCompare(evId) { if (!await nbMoveTo('data-nb-compare', evId)) return false; await press('Enter'); return true; }
async function nbEnsureMenu(max) {
  for (var i = 0; i < (max || 12); i++) {
    if (!nbOpen()) return false;
    if (nbVisible() && nbIds('data-nb-section').length === 4) return true;
    if (nbVisible()) await press('Escape'); else { await wait(LOCK + 45); snap(); }
  }
  return nbVisible() && nbIds('data-nb-section').length === 4;
}

async function run() {
  var E = GAME.Engine, NR = GAME.NarrativeRuntime, A = GAME.NarrativeAdapter, D = GAME.NarrativeData;
  if (GAME.Render3D) GAME.Render3D.render = function () {};
  var M4 = D.missions.M4, M5 = D.missions.M5, M6 = D.missions.M6, M8 = D.missions.M8;
  function S() { return A.getState(); }
  function val(name) { var s = S(); return s && s.values ? s.values[name] : undefined; }

  // ---- B0 — BOOT DI PRODUZIONE (C8-C.1): bootstrap PRIMA di deserialize/enable
  out.checks['B0 bootstrap_file_loaded'] = (typeof GAME.installNarrativeCatalogs === 'function');
  out.checks['B0 domains_empty_before_bootstrap'] =
    (Object.keys(NR.valueDomains).length === 0 && Object.keys(NR.valueTransitions).length === 0);
  var installed = GAME.installNarrativeCatalogs();     // <-- unico path di cablaggio
  out.run_log.catalogs_installed = installed;
  out.checks['B0 domains_installed_from_catalog'] =
    (JSON.stringify(installed.value_domains) === JSON.stringify(Object.keys(D.enums.values_allowed).sort()));
  out.checks['B0 bootstrap_before_any_deserialize'] = (Object.keys(NR.valueDomains).length > 0);
  // nessun cablaggio manuale dei domini nel sorgente dell'harness
  var ownSrc = [].slice.call(document.scripts).filter(function (s) { return !s.src; }).map(function (s) { return s.textContent; }).join('');
  out.checks['B0 no_manual_domain_wiring_in_harness'] =
    (ownSrc.indexOf('setValue' + 'Domains') < 0 && ownSrc.indexOf('setValue' + 'Transitions') < 0);
  E.state.mode = 'play';
  A.enable({ container: document.getElementById('narrative'), advanceLockMs: LOCK, missions: [M4, M5, M6, M8] });
  out.checks['B0 adapter_enabled_after_bootstrap'] = (A.isEnabled() === true);

  // pagine dei DATI GENERATI di M8 (ogni page_id dei record deve appartenere qui)
  var genIds = {};
  (function walk(o) {
    if (Array.isArray(o)) return o.forEach(walk);
    if (o && typeof o === 'object') { if (o.id && o.text !== undefined && o.mode) genIds[o.id] = true; for (var k in o) walk(o[k]); }
  })(M8);
  out.run_log.generated_page_count = Object.keys(genIds).length;

  // token INTERNI che non devono MAI comparire nel testo a schermo
  var TOK = ['promise_stance', 'warning_target', 'focus_destination', 'body_found_by', 'letter_o_observation_source',
    'letter_o_chain', 'presagio_status', 'maddy_action_after_warning', 'sarah_support_state', 'maddy_trovata',
    'E9A_LETTERA_O', 'E9B_STESSO_METODO', 'E3_LETTERA_R', 'E1_DIARIO', 'P8.formulation', 'LETTERS_SAME_METHOD',
    'NAME_OVERREACH', 'HOUSE_OVERREACH', 'PROGRESSIVE_SIGNATURE', 'cooper_primary', 'hawk_preserved',
    'departure_prepared', 'from_derivation', 'value_transition', 'm8_station', 'm8_roadhouse', 'm8_discovery',
    'm8_diner', 'm8_focus_choice', 'm8_cmp_diary', 'm8_cmp_letters', 'm8.a.', 'm8.b.', 'm8.c.', 'm8.d.', 'm8.e.', 'm8.f.'];

  // ---- stato iniziale: costruito col runtime, poi serialize→deserialize
  // (il deserialize VALIDA i valori tipizzati contro i domini: prova che il
  // bootstrap è avvenuto prima) ----
  function seedBase() { var s = NR.createState(); NR.applyEffects(s, [{ set: 'atto4' }, { evidence: 'E3_LETTERA_R' }, { evidence: 'E1_DIARIO' }]); return s; }
  function freshState() { return NR.deserialize(NR.serialize(seedBase())); }

  function clearClassic() { if (E.state) { E.state.dialogue = null; E.state.menu = null; E.state.mode = 'play'; } }
  // interazione dal KEYPATH DEL MOTORE: il player è posato ADIACENTE e RIVOLTO
  // al target, poi Invio → E.interact() → adapter. (Il CAMMINO tile-per-tile è
  // C8-E; qui la verità richiesta è quella di SCHERMO.)
  async function interactFromEngine(map, x, y, dir) {
    clearClassic(); E.loadMap(map, x, y, dir); await wait(120); clearClassic();
    await press('Enter');
  }
  async function drainLease() { for (var i = 0; i < 24 && A.active(); i++) { key('Escape'); window.dispatchEvent(new Event('blur')); await wait(90); snap(); } }

  /* record formale: congela il DOM PRIMA del commit, committa, rilegge lo stato */
  function mkRecord(o) { out.records.push(o); return o; }
  function stateSnap(keys) {
    var s = S(), o = {};
    keys.forEach(function (k) {
      if (k.indexOf('e:') === 0) o[k] = s.evidence[k.slice(2)] === true;
      else if (k.indexOf('f:') === 0) o[k] = s.flags[k.slice(2)] === true;
      else if (k.indexOf('n:') === 0) o[k] = s.nodes_done[k.slice(2)] === true;
      else if (k.indexOf('p:') === 0) o[k] = NR.peekProp(s, k.slice(2)).formulation.status;
      else if (k.indexOf('c:') === 0) o[k] = !!(s.comparisons[k.slice(2)] && s.comparisons[k.slice(2)].completed);
      else if (k === 'objective') o[k] = (NR.activeObjective(s, M8) || {}).id || null;
      else o[k] = s.values[k] === undefined ? null : s.values[k];
    });
    return o;
  }

  // posizioni di interazione (adiacente + facing) dei 7 target M8
  var AT = {
    maddy: ['diner', 10, 2, 'up'],           // NPC maddy @ diner 10,1 (registro condizionale)
    norma: ['diner', 6, 1, 'left'],          // NPC norma @ diner 5,1 (gioco classico)
    phone: ['roadhouse', 8, 6, 'up'],        // object roadhouse_phone @ 8,5
    leland: ['diner', 11, 2, 'up'],           // NPC Leland @ diner 11,1 dopo la promessa
    crossroads: ['town', 30, 31, 'up'],      // visible sign town_crossroads @ 30,30
    palmer: ['palmer', 8, 9, 'down'],        // landmark palmer_entrance @ 8,10
    lago: ['town', 15, 29, 'up'],            // landmark lago_maddy @ 15,28
    truman: ['sheriff', 6, 3, 'right']       // NPC Truman @ sheriff 7,3
  };
  async function go(k) { var t = AT[k]; await interactFromEngine(t[0], t[1], t[2], t[3]); }

  var ROUTE_NODE = { palmer: 'm8_route_palmer', lago: 'm8_route_lake', diner: 'm8_route_diner' };
  var ROUTE_LAST_PAGE = { palmer: 'm8.c.route_palmer.p04', lago: 'm8.c.route_lake.p01', diner: 'm8.c.route_diner.p02' };
  var ROUTE_GO = { palmer: 'palmer', lago: 'lago', diner: 'norma' };
  var DISCOVERY_LAST = { hawk: 'm8.d.discovery.hawk.p02', cooper: 'm8.d.discovery.cooper.p04' };

  /* =====================================================================
   * un PASSAGGIO completo attraverso la UI vera, con i record formali
   * ===================================================================== */
  async function runPass(P, opts) {
    var promise = opts.promise, warn = opts.warn, focus = opts.focus, finder = opts.finder;
    var c = {};
    seen = {}; seenText = {};
    await drainLease();
    A.setState(freshState());
    E.state.flags = { atto3: true, atto4: true, sogno_fatto: true, east_route_confirmed: true };

    // ---- R1 PROMESSA (choice_menu) -------------------------------------
    await go('maddy');
    c.promise_widget_reached = await advanceUntil(function () { return widgetOpts().indexOf('promise_' + promise) >= 0; }, 30);
    var r1 = {
      pass: P, id: P + '_R01_promise', record_type: 'choice_menu', node_id: 'm8_diner',
      choice_ids: widgetOpts().slice(), visible_text: widgetRootText(),
      lease_active_pre_commit: A.active() === true,
      state_before: stateSnap(['promise_stance', 'objective'])
    };
    c.promise_undefined_at_widget = (val('promise_stance') === undefined && A.active() === true);
    await chooseChoice('promise_' + promise);
    await advanceUntil(function () { return !A.active(); }, 20);
    r1.state_after = stateSnap(['promise_stance', 'objective']);
    mkRecord(r1);
    c.promise_written = (val('promise_stance') === promise);
    c.promise_objective_obj_m8_25 = ((NR.activeObjective(S(), M8) || {}).id === 'obj_m8_25');

    // ---- R1b LELAND AL DINER (taxi prima del Roadhouse/ritrovamento) ----
    c.leland_present_after_promise =
      ((GAME.Maps.diner.npcs || []).some(function (n) { return n.id === 'leland' && n.x === 11 && n.y === 1; }));
    await go('leland');
    c.leland_page_reached = await advanceToPage('m8.b0.leland_taxi.p02', 20);
    var r1b = {
      pass: P, id: P + '_R01b_leland_taxi', page_id: 'm8.b0.leland_taxi.p02', node_id: 'm8_leland_taxi',
      visible_text: pageText('m8.b0.leland_taxi.p02'), lease_active_pre_commit: A.active() === true,
      state_before: stateSnap(['e:T_LELAND_TAXI', 'f:maddy_trovata', 'body_found_by', 'objective'])
    };
    await press('Enter'); await wait(140); snap();
    await advanceUntil(function () { return !A.active(); }, 20);
    r1b.state_after = stateSnap(['e:T_LELAND_TAXI', 'f:maddy_trovata', 'body_found_by', 'objective']);
    mkRecord(r1b);
    c.taxi_heard_pre_roadhouse_and_discovery =
      (r1b.state_after['e:T_LELAND_TAXI'] === true && r1b.state_after['f:maddy_trovata'] === false &&
       r1b.state_after.body_found_by === null && r1b.state_after.objective === 'obj_m8_1');
    c.maddy_and_leland_absent_after_taxi =
      (!(GAME.Maps.diner.npcs || []).some(function (n) { return n.id === 'maddy' || n.id === 'leland'; }) &&
       !(E.state.npcs || []).some(function (n) { return n.id === 'maddy' || n.id === 'leland'; }));

    // ---- R2 ULTIMA PAGINA DEL GIGANTE (presagio nasce al commitNode) ----
    await go('phone');
    c.giant_last_page_reached = await advanceToPage('m8.b.roadhouse.p06', 30);
    var r2 = {
      pass: P, id: P + '_R02_giant_last_page', page_id: 'm8.b.roadhouse.p06',
      visible_text: pageText('m8.b.roadhouse.p06'),
      lease_active_pre_commit: A.active() === true,
      state_before: stateSnap(['presagio_status', 'objective'])
    };
    c.presagio_undefined_on_last_page = (val('presagio_status') === undefined && A.active() === true);
    await press('Enter'); await wait(140); snap();      // COMMIT del nodo
    r2.state_after = stateSnap(['presagio_status', 'objective']);
    mkRecord(r2);
    c.presagio_active_after_commit = (val('presagio_status') === 'active');

    // ---- R3 TELEFONO (choice_menu → tre stati scritti) ------------------
    c.phone_widget_reached = await advanceUntil(function () { return widgetOpts().indexOf('warning_' + warn) >= 0; }, 30);
    var r3 = {
      pass: P, id: P + '_R03_phone', record_type: 'choice_menu', node_id: 'm8_roadhouse',
      choice_ids: widgetOpts().slice(), visible_text: widgetRootText(),
      lease_active_pre_commit: A.active() === true,
      state_before: stateSnap(['warning_target', 'maddy_action_after_warning', 'sarah_support_state'])
    };
    c.warning_undefined_at_widget = (val('warning_target') === undefined && A.active() === true);
    c.phone_same_lease_as_giant = (A.active() === true);
    await chooseChoice('warning_' + warn);
    await advanceUntil(function () { return !A.active(); }, 20);
    r3.state_after = stateSnap(['warning_target', 'maddy_action_after_warning', 'sarah_support_state']);
    mkRecord(r3);
    c.warning_three_states_written =
      (val('warning_target') === warn && val('maddy_action_after_warning') !== undefined && val('sarah_support_state') !== undefined);

    // ---- R4 FOCUS (commit → gameplay restituito, NESSUN goto) -----------
    await go('crossroads');
    c.focus_widget_reached = await advanceUntil(function () { return widgetOpts().indexOf('focus_' + focus) >= 0; }, 30);
    var r4 = {
      pass: P, id: P + '_R04_focus', record_type: 'choice_menu', node_id: 'm8_focus_choice',
      choice_ids: widgetOpts().slice(), visible_text: widgetRootText(),
      lease_active_pre_commit: A.active() === true,
      state_before: stateSnap(['focus_destination', 'body_found_by'])
    };
    c.focus_undefined_at_widget = (val('focus_destination') === undefined && A.active() === true);
    var evPreFocus = A.events.length;
    await chooseChoice('focus_' + focus);
    await advanceUntil(function () { return !A.active(); }, 20);
    r4.state_after = stateSnap(['focus_destination', 'body_found_by', 'objective']);
    r4.no_goto_evidence = {
      lease_released: !A.active(),
      route_nodes_done: ['m8_route_palmer', 'm8_route_lake', 'm8_route_diner'].filter(function (id) { return S().nodes_done[id] === true; }),
      new_lease_acquires_after_commit: A.events.slice(evPreFocus).filter(function (e) { return e.event === 'lease_acquire'; }).length
    };
    mkRecord(r4);
    c.focus_written = (val('focus_destination') === focus);
    c.focus_no_goto_gameplay_returned =
      (!A.active() && r4.no_goto_evidence.route_nodes_done.length === 0 && val('body_found_by') === undefined &&
       r4.no_goto_evidence.new_lease_acquires_after_commit === 0);

    // ---- R5 ROTTA (ultima pagina → body_found_by cooper|hawk) -----------
    await go(ROUTE_GO[focus]);
    var lastRoute = ROUTE_LAST_PAGE[focus];
    c.route_last_page_reached = await advanceToPage(lastRoute, 30);
    var r5 = {
      pass: P, id: P + '_R05_route_' + focus, page_id: lastRoute, node_id: ROUTE_NODE[focus],
      visible_text: pageText(lastRoute),
      lease_active_pre_commit: A.active() === true,
      state_before: stateSnap(['body_found_by'])
    };
    c.body_found_by_undefined_on_last_route_page = (val('body_found_by') === undefined && A.active() === true);
    await press('Enter'); await wait(140); snap();
    await advanceUntil(function () { return !A.active(); }, 20);
    r5.state_after = stateSnap(['body_found_by']);
    mkRecord(r5);
    c.route_writes_finder = (val('body_found_by') === finder);

    // valigia NELLA ROTTA (classe 1): pagina condizionale VISTA a schermo
    var valigiaRoute = (seen['m8.c.route_palmer.p02'] === true);
    if (valigiaRoute) mkRecord({ pass: P, id: P + '_RV_valigia_route', page_id: 'm8.c.route_palmer.p02', visible_text: seenText['m8.c.route_palmer.p02'], state_before: null, state_after: null, note: 'pagina condizionale valigia MOSTRATA nella rotta Palmer' });

    // ---- R6 RITROVAMENTO (ultima pagina → tutti gli effetti) ------------
    // finestra eventi aperta PRIMA dell'interazione: il lease di SESSIONE
    // ('narrative', depth 1) deve essere acquisito UNA volta sola e coprire
    // ritrovamento + eco (i lease figli 'narrative-pages'/'narrative-widget'
    // sono contesti annidati dello STESSO lease, non nuove sessioni).
    var evPreSession = A.events.length;
    await go('lago');
    var lastDisc = DISCOVERY_LAST[finder];
    c.discovery_last_page_reached = await advanceToPage(lastDisc, 30);
    var DKEYS = ['e:E9A_LETTERA_O', 'e:E9B_STESSO_METODO', 'f:maddy_trovata', 'letter_o_observation_source', 'letter_o_chain', 'presagio_status'];

  out.failed = Object.keys(out.checks).filter(function (k) { return out.checks[k] !== true; });
  out.record_count = out.records.length;
  out.title = (allOk ? 'M8ST-PASS ' : 'M8ST-FAIL ') + out.passed + '/' + out.total;
  document.getElementById('log').textContent = JSON.stringify(out, null, 1);
  document.title = out.title;
  window.__C8D_RESULT = out;
}
window.addEventListener('load', function () {
  setTimeout(function () {
    run().catch(function (e) {
      out.errors.push('run: ' + (e && e.message || e) + ' | ' + (e && e.stack || ''));
      out.title = 'M8ST-ERR ' + (e && e.message || e);
      document.getElementById('log').textContent = JSON.stringify(out, null, 1);
      document.title = out.title;
    });
  }, 400);
});
</script>
</body>
</html>
