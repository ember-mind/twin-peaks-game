<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>TP-MOBILE-GAMEPLAY-LOADING</title>
<style>
  html,body,iframe{margin:0;border:0;width:100%;height:100%;overflow:hidden;background:#111913}
</style>
</head>
<body>
<iframe id="product" title="Twin Peaks gameplay visual"></iframe>
<script>
(function(){
  var frame=document.getElementById('product');
  var params=new URLSearchParams(location.search);
  var query=params.get('touch')==='0'?'':'touch=1&';
  query+='mobileVisual=heartgold-r120';
  frame.addEventListener('load',function(){
    setTimeout(function(){
      var w=frame.contentWindow,E=w.GAME.Engine;
      var q=new URLSearchParams(location.search);
      E.state.mode='play';E.state.flags.intro_town=true;
      E.loadMap(q.get('map')||'town',+(q.get('x')||12),+(q.get('y')||22),q.get('dir')||'up');
      document.title='TP-MOBILE-GAMEPLAY-READY';
    },800);
  });
  frame.src='../index.html?'+query;
})();
</script>
</body>
</html>
