  #speaker-name-hires { left:5.859375%; top:73.4375%; width:14.0625%; height:3.645833%; display:flex; align-items:center; justify-content:center; white-space:nowrap; font-size:calc(var(--native-scale, 1) * 4px); line-height:1; }
  #speaker-dialogue-hires { left:5.859375%; top:80.729167%; width:56.25%; height:9.375%; font-size:calc(var(--native-scale, 1) * 6.4px); line-height:1; letter-spacing:calc(var(--native-scale, 1) * .08px); }
  #speaker-dialogue-hires .speaker-line { position:absolute; left:0; width:100%; white-space:nowrap; }

<script>
/* ?freezeMs=N — harness only, installed before every game script. Pins the animation clock (performance.now,
 * Date.now, the rAF timestamp) and Math.random to a seeded LCG, so two captures of the same animated scene are
 * byte-reproducible. test/props-flag-off.js needs that to byte-compare a Roadhouse shot with and without the
 * prop layer. Without the parameter nothing here runs and the page behaves exactly as before. */
(function () {
  var raw = new URLSearchParams(location.search).get('freezeMs');
  if (raw === null) return;
  /* engine.js tick() drops every frame while now-lastTick < 8, and lastTick
   * starts at 0, so a clock pinned below 8 never paints at all. Clamp to the
   * first frozen clock that renders, and say so instead of shipping a blank
   * frame. Values >= 16 (every existing Chrome gate uses 1000) are untouched. */
  var requested = Number(raw);
  if (!Number.isFinite(requested)) requested = 0;
  var t = Math.max(16, requested);
  if (t !== requested) {
    console.log('retro-scene: freezeMs=' + raw + ' clamped to ' + t + ' (engine.js tick needs now-lastTick >= 8)');
  }
  performance.now = function () { return t; };
  Date.now = function () { return t; };
  var raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function (cb) { return raf(function () { cb(t); }); };
  var seed = (t >>> 0) || 1;
  Math.random = function () { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
}());
</script>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var map = q.get('map') || 'sheriff';
  var x = Number(q.get('x') || 6);
  var y = Number(q.get('y') || 8);
  var dir = q.get('dir') || 'up';
  var cv = document.getElementById('game');
  var stage = document.getElementById('stage');
  var fit = Math.min(innerWidth / 256, innerHeight / 192);
  var scale = fit >= 1 ? Math.max(1, Math.floor(fit)) : fit;
  stage.style.width = Math.floor(256 * scale) + 'px';
  stage.style.height = Math.floor(192 * scale) + 'px';
  stage.style.setProperty('--native-scale', scale);
  stage.style.left = Math.floor((innerWidth - parseInt(stage.style.width, 10)) / 2) + 'px';
  stage.style.top = Math.floor((innerHeight - parseInt(stage.style.height, 10)) / 2) + 'px';
  /* Modalita' silhouette (?silhouette=1): dipinge in nero pieno i tile
   * edificio e in bianco tutto il resto. Serve a verificare che gli ingombri
   * siano davvero diversi fra loro, senza che colore, tetto e insegne
   * mascherino il fatto che la sagoma e' sempre la stessa. Vive solo qui
   * nell'harness: il gioco non la conosce. */
  if (q.get('silhouette') === '1') {
    var realDrawTile = GAME.Sprites.drawTile;
    GAME.Sprites.drawTile = function (ctx, ch, x, y, tx, ty, rows) {
      var isBuilding = '0123456789D'.indexOf(ch) >= 0;
      ctx.fillStyle = isBuilding ? '#000000' : '#ffffff';
      ctx.fillRect(x, y, 16, 16);
    };
    GAME.Sprites.drawChar = function () {};
    if (GAME.sprites && GAME.sprites.drawStructures) GAME.sprites.drawStructures = function () {};
  }
  GAME.Engine.init(cv, null);
  var engineStarted = false;
  function startEngine() { if (!engineStarted) { engineStarted = true; GAME.Engine.start(); } }
  if (GAME.Sprites.castReady && typeof GAME.Sprites.castReady.then === 'function') {
    GAME.Sprites.castReady.then(startEngine, startEngine);
  } else startEngine();
  if (q.get('clarity') === '1') {
    var probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;line-height:1';
    document.body.appendChild(probe);
    var failures = [], measured = 0;
    Object.keys(GAME.Data.dialogues).forEach(function (id) {
      var def = GAME.Data.dialogues[id];
      var pages = (def.pages || []).concat(def.again && def.again.pages || []);
      pages.forEach(function (page) {
        var lines = GAME.RetroFont.wrapChars(String(page.text || ''), 24);
        for (var li = 0; li < lines.length; li += 2) {
          var pair = GAME.RetroFont.balanceFixedPair(lines.slice(li, li + 2), 24);
          probe.style.fontSize = (scale * 6.4) + 'px';
          probe.style.letterSpacing = (scale * 0.08) + 'px';
          pair.forEach(function (line) {
            probe.textContent = line; measured++;
            if (probe.getBoundingClientRect().width > 138 * scale) failures.push(id + ': ' + line);
          });
          var key = GAME.Portraits.resolve(page.name, page.portrait);
          var label = GAME.Portraits.label(page.name, key, 36);
          probe.style.fontSize = (scale * 4) + 'px';
          probe.style.letterSpacing = 'normal';
          probe.textContent = label; measured++;
          if (probe.getBoundingClientRect().width > 36 * scale) failures.push(id + ': [' + label + ']');
        }
      });
    });
    probe.remove();
    document.body.setAttribute('data-clarity-measured', String(measured));
    document.body.setAttribute('data-clarity-overflow', JSON.stringify(failures));
  }
  setTimeout(function prepareScene() {
    if (!engineStarted) { setTimeout(prepareScene, 10); return; }
    GAME.Engine.state.mode = 'play';
    if (q.get('suppressOnEnter') !== '0') GAME.Engine.state.flags.intro_town = true;
    if (q.get('flags')) q.get('flags').split(',').forEach(function (name) {
      if (name) GAME.Engine.state.flags[name] = true;
    });
    /* ?narrative=1: installa lo stack narrativo (stessi moduli e ordine di
     * index.html) prima del loadMap, cosi' gli attori iniettati (es. Ronette,
     * l'infermiera) compaiono anche in questa cattura statica. */
    if (q.get('narrative') === '1' && GAME.NarrativeAdapter) GAME.NarrativeAdapter.enable();
    /* ?nstate=<base64 JSON>: stato narrativo seminato (catture di stati M5,
     * Act 3 pass 01) — passa da setState, che risincronizza le entità. */
    if (q.get('nstate') && GAME.NarrativeAdapter && GAME.NarrativeAdapter.setState) {
      try { GAME.NarrativeAdapter.setState(JSON.parse(atob(q.get('nstate')))); } catch (e) { console.error('nstate', e); }
    }
    GAME.Engine.loadMap(map, x, y, dir);
    if (q.get('dialogue') === '1') {
      var speaker = q.get('speaker') || 'COOPER';
      GAME.Engine.state.dialogue = {
        id: 'visual-audit', def: { pages: [] }, replay: true, i: 0,
        pages: [{ name: speaker, text: 'Harry. Ho sognato una stanza rossa.' }]
      };
    }
    /* R101 usa lo stesso renderer cast nativo in test e produzione: niente
     * Image asincrona, niente frame fallback promosso per errore. */
    document.body.setAttribute('data-cast-renderer',
      GAME.Retro2D && GAME.Retro2D.castRenderer && GAME.Retro2D.castRenderer.id || 'missing');
    /* Prova temporale R101: un passo nasce dal vero loop di produzione,
     * riceve input tastiera reale e viene campionato lossless ogni 55 ms.
     * Non ricostruiamo i frame nel test: esportiamo il canvas che il giocatore
     * vede, inclusi scorrimento, cadenza e ritorno alla posa idle. */
    if (q.get('motion') === '1') {
      window.__TP_SHOT_FRAMES__ = [];
      setTimeout(function startProductionWalk() {
        window.dispatchEvent(new KeyboardEvent('keydown', {
          code: 'ArrowRight', key: 'ArrowRight', bubbles: true
        }));
        var sample = 0;
        function captureMotionFrame() {
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              window.__TP_SHOT_FRAMES__.push(cv.toDataURL('image/png'));
              sample++;
              if (sample === 5) {
                window.dispatchEvent(new KeyboardEvent('keyup', {
                  code: 'ArrowRight', key: 'ArrowRight', bubbles: true
                }));
              }
              if (sample < 12) {
                setTimeout(captureMotionFrame, 55);
                return;
              }
              fetch('../index.html').then(function (response) { return response.text(); }).then(function (index) {
                if (GAME.Retro2D.castRenderer.id !== 'heartgold-atlas-r116' ||
                    index.indexOf('retro-authored.js?v=r126-tree-cleanup') < 0) {
                  throw new Error('production cast provenance mismatch');
                }
                document.body.setAttribute('data-motion-provenance', 'r126-tree-cleanup');
                document.body.setAttribute('data-native-png', cv.toDataURL('image/png'));
                document.title = 'TP-RETRO-MOTION-READY ' + map;
              }).catch(function (error) {
                window.__TP_SHOT_ERROR__ = error.message;
                document.title = 'TP-SHOT-ERROR';
              });
            });
          });
        }
        captureMotionFrame();
      }, 80);
      return;
    }
    /* Non dichiarare READY prima che almeno alcuni rAF abbiano dipinto la
     * scena richiesta. La vecchia esportazione a 80 ms poteva fotografare il
     * titolo pur avendo gia' cambiato state.mode: prova falsa nel Gauntlet. */
    setTimeout(function exportNativeFrame() {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          document.body.setAttribute('data-native-png', cv.toDataURL('image/png'));
          document.title = 'TP-RETRO-READY ' + map;
        });
      });
    }, 360);
  }, 40);
})();
</script>
