<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><title>TP-RETRO-SPRITES</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111913}
#stage{position:fixed;left:0;top:0;width:800px;height:720px;transform:none}
canvas{width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body><div id="stage"><canvas id="audit" width="160" height="144"></canvas></div>
<script src="../js/tiles.js"></script><script src="../js/chars.js"></script><script src="../js/houses.js"></script><script src="../js/maps.js?v=r69i1"></script><script src="../js/data.js"></script><script src="../js/retro-font.js?v=gold46"></script><script src="../js/engine.js?v=r69i1"></script><script src="../js/scene-objects.gen.js"></script><script src="../js/glue.js?v=gold48"></script><script src="../js/retro.js?v=gold46"></script><script src="../js/retro-authored.js?v=r69i1"></script>
<script>
(function(){
 var stage=document.getElementById('stage'),fit=Math.min(innerWidth/160,innerHeight/144),scale=fit>=1?Math.max(1,Math.floor(fit)):fit;
 stage.style.width=Math.floor(160*scale)+'px';stage.style.height=Math.floor(144*scale)+'px';
 stage.style.left=Math.floor((innerWidth-parseInt(stage.style.width,10))/2)+'px';stage.style.top=Math.floor((innerHeight-parseInt(stage.style.height,10))/2)+'px';
 var c=document.getElementById('audit').getContext('2d'),rows=[];for(var y=0;y<9;y++)rows.push('..........');
 for(y=0;y<9;y++)for(var x=0;x<10;x++)GAME.Sprites.drawTile(c,'.',x*16,y*16,x,y,rows,{});
 var dirs=['down','left','up','right'],names=['cooper','cooper','cooper','cooper'];
 for(var d=0;d<4;d++){
   c.fillStyle='#f5efcf';c.fillRect(1+d*40,4,38,12);c.strokeStyle='#183225';c.strokeRect(1.5+d*40,4.5,37,11);
   GAME.RetroFont.draw(c,dirs[d].toUpperCase().slice(0,5),5+d*40,7,'#183225',{scale:1,maxChars:5});
   GAME.Sprites.drawChar(c,12+d*40,37,GAME.Sprites.CHARS[names[d]],dirs[d],0,1,false);
   GAME.Sprites.drawChar(c,12+d*40,83,GAME.Sprites.CHARS[names[d]],dirs[d],1,1,true);
 }
 c.fillStyle='#183225';c.fillRect(0,125,160,19);GAME.RetroFont.draw(c,'IDLE / PASSO',47,131,'#f5efcf',{scale:1});
 document.body.setAttribute('data-native-png',document.getElementById('audit').toDataURL('image/png'));
 document.title='TP-RETRO-SPRITES-READY';
})();
</script></body></html>
