<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><title>TP-RETRO-UI-LOADING</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111913}
#stage{position:fixed;left:0;top:0;width:800px;height:720px;transform:none}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body><div id="stage"><canvas id="game" width="160" height="144"></canvas></div>
<script src="../js/tiles.js"></script><script src="../js/chars.js"></script><script src="../js/houses.js"></script>
<script src="../js/maps.js?v=gold51"></script><script src="../js/data.js"></script><script src="../js/retro-font.js?v=gold46"></script>
<script src="../js/engine.js?v=gold47"></script><script src="../js/glue.js?v=gold48"></script><script src="../js/retro.js?v=gold46"></script><script src="../js/retro-authored.js?v=r75cooper1"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search),screen=q.get('screen')||'title';
  var stage=document.getElementById('stage'),fit=Math.min(innerWidth/160,innerHeight/144),scale=fit>=1?Math.max(1,Math.floor(fit)):fit;
  var sw=Math.floor(160*scale),sh=Math.floor(144*scale);stage.style.width=sw+'px';stage.style.height=sh+'px';
  stage.style.left=Math.floor((innerWidth-sw)/2)+'px';stage.style.top=Math.floor((innerHeight-sh)/2)+'px';
  GAME.Engine.init(document.getElementById('game'),null);GAME.Engine.start();
  setTimeout(function(){
    var E=GAME.Engine,S=E.state;S.flags.intro_town=true;
    if(screen==='intro'){S.mode='intro';S.introPage=0;}
    else if(screen==='dialogue'){
      S.mode='play';E.loadMap('sheriff',4,8,'up');
      S.dialogue={id:'ui-audit',def:{pages:[]},replay:true,i:0,pages:[{name:'COOPER',text:'Harry. Ho sognato una stanza rossa.'}]};
    }else if(screen==='menu'){
      S.mode='play';E.loadMap('town',30,23,'up');S.clues=Object.keys(GAME.Data.clues).slice(0,6);S.menu=true;S.menuIndex=2;
    }else if(screen==='end'){
      S.mode='end';S.endPage=Number(q.get('page')||0);S.clues=Object.keys(GAME.Data.clues);
    }else S.mode='title';
    document.title='TP-RETRO-UI-READY '+screen;
  },60);
})();
</script></body></html>
