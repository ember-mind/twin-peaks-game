<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Peaks Game — screenshot harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #gl { background: #000; }
  #game { background: transparent; }
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
  }
  #grain {
    position: absolute; inset: 0; pointer-events: none; z-index: 6; opacity: 0.06;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%25" height="100%25" filter="url(%23n)"/></svg>');
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="960" height="640"></canvas>
  <div id="vignette"></div>
  <div id="grain"></div>
  <canvas id="game" width="480" height="320"></canvas>
</div>

<script src="../js/vendor/three.min.js"></script>
<script src="../js/tiles.js"></script>
<script src="../js/chars.js"></script>
<script src="../js/houses.js"></script>
<script src="../js/maps.js"></script>
<script src="../js/data.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/render3d.js"></script>
<script src="../js/glue.js"></script>
<script src="../js/main.js"></script>

<script>
window.addEventListener('load', function () {
  var q = new URLSearchParams(location.search);
  setTimeout(function () {
    var E = GAME.Engine;
    E.state.mode = 'play';
    if (q.get('map')) E.loadMap(q.get('map'), +(q.get('x') || 30), +(q.get('y') || 31), q.get('dir') || 'up');
    if (q.get('clues')) E.state.clues = ['a','b','c','d'].slice(0, +q.get('clues'));
    if (q.get('flag')) E.state.flags[q.get('flag')] = true;

    var gl = document.getElementById('gl');
    var ov = document.createElement('canvas');
    ov.width = gl.width; ov.height = gl.height;
    ov.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:99;';
    document.getElementById('stage').appendChild(ov);
    var cx = ov.getContext('2d');
    setInterval(function () {
      try {
        GAME.Render3D.render(E.state, 16, performance.now());
        cx.drawImage(gl, 0, 0);
      } catch (e2) {}
    }, 80);
  }, 400);
});
</script>
</body>
</html>
