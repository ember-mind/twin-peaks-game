<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Station Population Pass 01</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #17251e; color: #f4e6c8; font: 14px/1.4 monospace; }
    body { display: grid; place-items: center; padding: 16px; }
    main { display: grid; grid-template-columns: auto minmax(310px, 410px); gap: 18px; align-items: center; }
    #stage { position: relative; width: 768px; height: 576px; overflow: hidden; image-rendering: pixelated; image-rendering: crisp-edges; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    aside { display: grid; gap: 12px; max-height: calc(100vh - 32px); overflow: auto; padding: 14px; border: 1px solid #946345; background: #24382f; }
    h1, h2 { margin: 0; color: #ffe18a; }
    h1 { font-size: 17px; }
    h2 { font-size: 14px; }
    p { margin: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 7px; }
    .actor { display: grid; gap: 7px; border-top: 1px solid #71806b; padding-top: 10px; }
    button { padding: 7px 9px; border: 1px solid #946345; color: inherit; background: #35271f; font: inherit; cursor: pointer; }
    button:hover { background: #65452f; }
    button:disabled { cursor: wait; opacity: .55; }
    .label { color: #ffe18a; font-weight: bold; }
    #debug { min-height: 18em; margin: 0; white-space: pre-wrap; color: #d4d8c7; }
    body.clean aside { display: none; }
    body.clean main { grid-template-columns: auto; }
    body.clean { padding: 0; }
    @media (max-width: 1020px) {
      body { display: block; }
      main { grid-template-columns: 1fr; justify-items: center; }
      aside { width: min(100%, 620px); max-height: none; }
    }
  </style>
</head>
<body>
  <main>
    <div id="stage"><canvas id="game" width="256" height="192"></canvas></div>
    <aside>
      <h1>Station Population Pass 01</h1>
      <p>Production timing is intentionally quiet. The minute observation uses real time at rate 1.</p>
      <div class="controls">
        <button id="pause" type="button">Pause</button>
        <button id="reset" type="button">Reset population</button>
        <button id="accelerate" type="button">Accelerated review: off</button>
        <button id="interact-all" type="button">Walk + interact with all</button>
      </div>

      <section class="actor">
        <h2>Truman — sheriff desk</h2>
        <div class="controls">
          <button data-actor="truman" data-pose="still" type="button">Still</button>
          <button data-actor="truman" data-pose="blink" type="button">Blink</button>
          <button data-actor="truman" data-pose="read-file" type="button">Read file</button>
        </div>
      </section>

      <section class="actor">
        <h2>Lucy — reception</h2>
        <div class="controls">
          <button data-actor="lucy" data-pose="still" type="button">Still</button>
          <button data-actor="lucy" data-pose="blink" type="button">Blink</button>
          <button data-actor="lucy" data-pose="telephone" type="button">Telephone</button>
        </div>
      </section>

      <section class="actor">
        <h2>Andy — work desk</h2>
        <div class="controls">
          <button data-actor="andy" data-pose="still" type="button">Still</button>
          <button data-actor="andy" data-pose="blink" type="button">Blink</button>
          <button data-actor="andy" data-pose="check-note" type="button">Check note</button>
        </div>
      </section>

      <p><span class="label">Manual poses are review-only.</span> They pause all population clocks until Return to live.</p>
      <div class="controls"><button id="return-live" type="button">Return to live</button></div>
      <details id="debug-details">
        <summary>Debug state</summary>
        <pre id="debug"></pre>
      </details>
    </aside>
  </main>

  <script src="../js/tiles.js"></script>
  <script src="../js/chars.js"></script>
  <script src="../js/houses.js"></script>
  <script src="../js/maps.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/retro-font.js"></script>
  <script src="../js/portraits.js"></script>
  <script src="../js/gold-tone.js"></script>
  <script src="../js/engine.js"></script>
  <script src="../js/scene-objects.gen.js"></script>
  <script src="../js/glue.js"></script>
  <script src="../js/retro.js"></script>
  <script src="../js/retro-cast-matrices-a.js"></script>
  <script src="../js/retro-cast-matrices-b.js"></script>
  <script src="../js/retro-authored.js"></script>
  <script src="../js/ambient-life.js"></script>
  <script src="../js/character-activity.js"></script>
  <script src="../js/environment-reactions.js"></script>
  <script src="../js/ambient-life-scenes.js"></script>
  <script src="../js/location-connections.js"></script>
  <script src="../js/double-r-exterior-art.js"></script>
  <script src="../js/double-r-exterior-scene.js"></script>
  <script src="../js/world-connections.gen.js"></script>
  <script src="../js/double-r-location-production.js"></script>
  <script src="../js/sheriffs-station-art.js"></script>
  <script src="../js/sheriffs-station-exterior-art.js"></script>
  <script src="../js/sheriffs-station-scene.js"></script>
  <script src="../js/sheriffs-station-exterior-scene.js"></script>
  <script src="../js/sheriffs-station-production.js"></script>
  <script src="../js/character-life-scenes.js"></script>
  <script src="../js/world-connections-production.js"></script>
  <script src="../js/world-engine.js"></script>
  <script src="../js/world-catalog.js"></script>
  <script src="pages/station-population-preview.js"></script>
</body>
</html>
